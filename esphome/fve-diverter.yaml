# ============================================================================
# ESP32 #2 — FVE diverter (ESPHome)
# Riadi el. špirály z prebytku FVE: TUV 3 kW @ L1 + podlaha 600 W @ L2.
# TRIAC fázovka (rbdimmer 40A) riadená cez 2× DimmerLink (I2C, hardvérový
# Z-C/firing) — PRIMÁRNE riešenie, rozhodnutie 2026-08-27. PI regulácia na ESP.
# ⚠️ Dve nesúvisiace funkcie, nemiešať: (1) čerpadlo TUV = náhrada TechController
#    ECO, podľa vlastných senzorov, s Daikinom nič spoločné; (2) čerpadlo podlahy =
#    NOVÁ funkcia podľa Daikin OPTO, TechController ECO s podlahou nikdy nič nemal.
# Schéma: ../docs/schematics/fve_schema.svg   |   GPIO mapa v README.
#
# STAV (2026-11-15): OSTRÁ VERZIA — regulácia beží. Meranie: Shelly 3EM
#       priamo (5 s, brzda/plyn) + Solax cloud cez HA (~4 min, krok podľa
#       batérie), kým nepríde Solax dongl. Logika: ../README.sk.md
#       sekcia „Ostrá verzia 2026-11-15“. HA časť: packages/fve_strategia.yaml.
#       Testovacia verzia (fve-diverter-test.yaml) načíta tento súbor s
#       regulacia_aktivna: "false" (všetko ručne z HA).
# ============================================================================

substitutions:
  # === PRISPÔSOB SI (verejná verzia) =========================================
  shelly_ip: "192.168.1.50"     # Shelly 3EM-63 Gen3 na prípojke (rpc/EM.GetStatus)
  latitude: "48.15°"            # poloha domu — východ/západ slnka (okno FVE)
  longitude: "17.11°"
  # ==========================================================================
  regulacia_aktivna: "true"     # testovacia verzia prepíše na "false"
  # Relé (stykače, bypassy, čerpadlá, fany dosiek) v HA LEN NA ZOBRAZENIE (user 2026-11-16):
  # ostrá regulácia ich aj tak do 5 s vráti podľa svojej logiky, ručné prepnutie by len
  # zbytočne cvaklo stykačom. Vynútený ohrev = „manuálny výkon“. Stav ukazujú binary
  # senzory s rovnakým názvom. Testovacia verzia prepíše na "false" (relé ovládateľné).
  rele_internal: "true"
  # OneWire zbernica pre DS18B20 B2 (vratná) a B3 (podlaha): vlastný pin (ako teraz) alebo
  # spoločná zbernica G21 s B1 — na novej doske prepojky JP5/JP6 (2-3 = G21). Pri prepnutí
  # na spoločnú zbernicu: obe na ow_bus + zapísať adresy nových snímačov.
  ow_b2: ow_vratna              # alebo ow_bus
  ow_b3: ow_podlaha             # alebo ow_bus

esphome:
  name: fve-diverter
  friendly_name: FVE diverter
  on_boot:
    - priority: -100            # po obnovení režimu z flash a inicializácii vstupov
      then:
        - script.execute: cerpadlo_podlaha_aplikuj
        # Krivka DimmerLinkov vždy LINEAR — regulácia s ňou počíta (prepočet výkon →
        # úroveň). RMS overená meraním 2026-11-15 ako nevhodná. Prepínač krivky je
        # len v testovacej verzii.
        - lambda: |-
            id(dimmerlink_tuv)->set_curve(dimmerlink::DimmingCurve::LINEAR);
            id(dimmerlink_podlaha)->set_curve(dimmerlink::DimmingCurve::LINEAR);

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

# --- Sieť / správa (heslá v secrets.yaml, NIE v gite!) ---------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESPHome default na ESP32 = LIGHT (= ESP-IDF WIFI_PS_MIN_MODEM): rádio spí a
  # budí sa až na DTIM beacon → príjem dát meškal až ~320 ms (zmerané 2026-11-09,
  # ping 3,7–319 ms rovnomerne). ESP je napájané zo siete, úspora nemá zmysel —
  # vypnuté kvôli odozve (príkazy z HA, odpovede Shelly/Solax).
  power_save_mode: none
  ap:                          # fallback AP, ak sa nepripojí
    ssid: "FVE-diverter fallback"
    password: !secret ap_password

logger:
  logs:
    http_request: INFO   # Shelly každé 2 s → bez DEBUG hlavičiek (2026-11-16)

api:
  encryption:
    key: !secret api_key
  # Default ESPHome = 15 min: bez pripojeného HA sa ESP reštartuje. Diverter
  # musí fungovať aj bez HA (výpadok HA nesmie reštartovať reguláciu a
  # rozopnúť stykače) → vypnuté (2026-11-09).
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# ============================================================================
# ČAS + SLNKO — okno FVE podľa východu/západu (od 2026-11-16, predtým pevné 6–20 h)
# ============================================================================
# SNTP aj výpočet východu/západu (`sun:`) bežia NEZÁVISLE od HA. Okno =
# východ + X min … západ − Y min (number „Okno FVE — …“). Dolina (Influx 9/2025–
# 11/2026, výroba Solax): priame slnko na panely ~2 h 40 min–3 h po východe, končí
# ~2 h 15 min–2 h 30 min pred západom → default +120 / −120 min = vonkajšia hranica,
# skutočný štart určí prvý prebytok („slnečný deň“, viď REGULÁCIA).
# ----------------------------------------------------------------------------
time:
  - platform: sntp
    id: esptime
    timezone: Europe/Bratislava

sun:
  id: slnko_poloha
  latitude: ${latitude}      # substitúcia hore
  longitude: ${longitude}

# ============================================================================
# SENZORY TEPLOTY — DS18B20, KAŽDÝ NA VLASTNOM PINE (od 2026-11-14)
# ============================================================================
# 2026-11-14: snímače (lacné klony) fungujú každý sám, ale dva na spoločnej
# zbernici NIE (dáta stiahnuté na 0, ESP číta samé nuly aj z neexistujúcej
# adresy; test mimo kovu = nie únik cez potrubie). → 3 samostatné OneWire
# zbernice, každá s vlastným 4,7 kΩ pull-upom DATA → 3,3 V:
#   GPIO21 + R1 → TUV bojler · GPIO5 + R7 → vratná TUV · GPIO13 + R8 → podlaha
# Červený/čierny (3,3 V / GND) môžu byť spoločné, oddelené sú len žlté (DATA).
# GPIO5 = strapping pin (pri štarte musí byť HIGH) — pull-up R7 to zaručí.
#
# >>> AKO ZISTIŤ ADRESY (spraviť RAZ pri oživovaní): <<<
# 1. Zakomentuj `address:` riadky nižšie (nechaj len platform + name),
#    alebo nasaď túto kostru s pripojeným LEN JEDNÝM senzorom.
# 2. Nahraj firmware, otvor logy (esphome logs / v HA).
#    ESPHome vypíše: "Found sensors: 0x28ff1c0300aabbcc" atď.
# 3. Priraď adresu miestu (pripájaj po jednom, alebo „teplý test" — chyť
#    senzor do ruky a sleduj, ktorá teplota stúpne).
# 4. Doplň adresy nižšie a kábel každého senzoru fyzicky oštítkuj.
# ⚠️ VŽDY s adresami — bez nich ESPHome berie senzory „po poradí" a po
#    reštarte môže TUV ukazovať podlahu!
# ----------------------------------------------------------------------------
one_wire:
  - platform: gpio
    id: ow_bus                 # TUV bojler (R1)
    pin: GPIO21
  - platform: gpio
    id: ow_vratna              # vratná voda TUV (R7)
    pin: GPIO5
  - platform: gpio
    id: ow_podlaha             # voda podlaha (R8)
    pin: GPIO13

sensor:
  # Manuálny výkon — zostávajúci čas do návratu na automatiku (0 = manuál neaktívny)
  - platform: template
    name: "TUV — manuál zostáva"
    id: manual_tuv_zostava
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(manual_tuv_pct).state <= 0.5f || id(manual_tuv_od_ms) == 0) return 0.0f;
      float lim = id(manual_limit_h).state * 60.0f;
      float ubehlo = (millis() - id(manual_tuv_od_ms)) / 60000.0f;
      return std::max(0.0f, lim - ubehlo);
  - platform: template
    name: "Podlaha — manuál zostáva"
    id: manual_pod_zostava
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(manual_podlaha_pct).state <= 0.5f || id(manual_pod_od_ms) == 0) return 0.0f;
      float lim = id(manual_limit_h).state * 60.0f;
      float ubehlo = (millis() - id(manual_pod_od_ms)) / 60000.0f;
      return std::max(0.0f, lim - ubehlo);

  - platform: dallas_temp
    one_wire_id: ow_bus
    address: 0x4900000023440328    # zistené 2026-11-14
    name: "Teplota TUV bojler"
    id: t_tuv
    update_interval: 30s

  - platform: dallas_temp
    one_wire_id: ${ow_b2}
    address: 0x9A00000022326128    # zistené 2026-11-14 (farby kábla štandardné)
    name: "Teplota vratná voda TUV"
    id: t_tuv_vratna
    update_interval: 30s

  - platform: dallas_temp
    one_wire_id: ${ow_b3}
    address: 0x690000002229DA28    # zistené 2026-11-15 (GPIO13 + R8)
    name: "Teplota voda podlaha"
    id: t_podlaha
    update_interval: 30s

  # VOLITEĽNÉ (2026-11-10): 4. DS18B20 — teplota v skrini pri dimmeroch.
  # ⚠️ Od 2026-11-14 nie je voľný pin a klony nejdú po dvoch na zbernici →
  # len ak sa nájde snímač, ktorý so susedom funguje, alebo cez DS2482 (I2C). Odkomentovať, ak sa
  # doplní; adresu zistiť cez test verziu (tlačidlo „Test — hľadať DS18B20“ → „Test — DS18B20 adresy“).
  # - platform: dallas_temp
  #   address: 0x0000000000000000
  #   name: "Teplota skriňa (dimmery)"
  #   id: t_skrina
  #   update_interval: 30s

# ----------------------------------------------------------------------------
# SENZORY NA DOSKÁCH DIMMEROV (rbdimmer 40A-CS, potvrdené z pinoutu 2026-09-13)
# ----------------------------------------------------------------------------
# Obe TRIAC dosky sú CS variant s vlastným current senzorom aj teplotným
# senzorom TRIAC-u (piny TEMP/CUR-S na 8-pin konektore) — NEjdú cez DimmerLink
# (ten prenáša cez I2C len VCC/GND/Z-C/DIM), musia priamo na ADC ESP32.
# ⚠️ Použité ADC1 piny (GPIO32-39) — na ADC2 (napr. GPIO4/27/26/14/25) je
# meranie nespoľahlivé, keď beží WiFi (HW obmedzenie ESP32, nie ESPHome bug).
# TEMP/CUR-S sú na ADC1 pinoch — od 2026-11-10 (nové rozloženie podľa
# ../docs/schematics/esp32_pinout_zapojenie.png): TUV 36/39, podlaha 34/35 (predtým
# naopak). rbdimmer2 podlaha = GPIO34·35·32 tri piny vedľa seba (1 konektor),
# rbdimmer1 TUV = GPIO36·39 + FAN GPIO33.
# ⚠️⚠️ OPRAVA (2026-11-04): GPIO34/35/36/39 sú HW input-only (žiadny výstupný
# driver) — FAN z dosiek dimmerov (digitálny výstup, library `fan_gpio`, pozri
# TODO_fve_diverter.md) preto NESMIE byť na týchto pinoch. Od 2026-11-10:
# FAN TUV = GPIO33, FAN podlaha = GPIO32 (oba výstupovo schopné).
# TODO (dolaď pri oživení): attenuation aj kalibrácia (filters: calibrate_linear
# alebo linear_map) na základe HW trimra "CURRENT SENSOR ADJUSTMENT" na doske
# a skutočne nameraných referenčných hodnôt — surové napätie samo o sebe nie
# je ani °C ani A. Až bude t_dimmer_tuv/podlaha v °C, odkomentovať automatiku
# fanov (switch fan_dimmer_tuv/podlaha nižšie + on_value_range tu).
  # TEMP dosky dimmera TUV (2026-11-15): holý NTC 10k B3950 proti GND (zmerané
  # 10,87 kΩ pri ~23 °C) + pull-up R4 10 kΩ na 3,3 V → napätie → odpor → °C.
  # Kým nie je TEMP zapojený, pin visí a hodnota je nezmysel — automatika teploty
  # TRIAC-u (fany, ochrana) ide len pri zapnutom „Teplota TRIAC — zapojená“.
  - platform: adc
    pin: GPIO36
    name: "Dimmer TUV — TEMP napätie"
    id: t_dimmer_tuv_v
    entity_category: diagnostic
    update_interval: 10s
    attenuation: 12db
  - platform: resistance
    sensor: t_dimmer_tuv_v
    id: t_dimmer_tuv_r
    configuration: DOWNSTREAM       # NTC medzi pinom a GND
    resistor: 10kOhm
    reference_voltage: 3.3V
    internal: true
  - platform: ntc
    sensor: t_dimmer_tuv_r
    name: "Teplota TRIAC dimmer TUV"
    id: t_dimmer_tuv
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - filter_out: nan

  - platform: adc
    pin: GPIO39
    name: "Prúd dimmer TUV (CUR-S)"
    id: i_dimmer_tuv
    update_interval: 10s
    attenuation: 12db

  # TEMP dosky dimmera podlaha (2026-11-15): holý NTC 10k B3950 proti GND (zmerané
  # 10,87 kΩ pri ~23 °C) + pull-up R5 10 kΩ na 3,3 V → napätie → odpor → °C.
  # Kým nie je TEMP zapojený, pin visí a hodnota je nezmysel — automatika teploty
  # TRIAC-u (fany, ochrana) ide len pri zapnutom „Teplota TRIAC — zapojená“.
  - platform: adc
    pin: GPIO34
    name: "Dimmer podlaha — TEMP napätie"
    id: t_dimmer_podlaha_v
    entity_category: diagnostic
    update_interval: 10s
    attenuation: 12db
  - platform: resistance
    sensor: t_dimmer_podlaha_v
    id: t_dimmer_podlaha_r
    configuration: DOWNSTREAM       # NTC medzi pinom a GND
    resistor: 10kOhm
    reference_voltage: 3.3V
    internal: true
  - platform: ntc
    sensor: t_dimmer_podlaha_r
    name: "Teplota TRIAC dimmer podlaha"
    id: t_dimmer_podlaha
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - filter_out: nan

  - platform: adc
    pin: GPIO35
    name: "Prúd dimmer podlaha (CUR-S)"
    id: i_dimmer_podlaha
    update_interval: 10s
    attenuation: 12db

# ----------------------------------------------------------------------------
# POČÍTADLÁ ZOPNUTÍ STYKAČOV (2026-09-27, príprava na ESP; doplnené 2026-09-29
# o obehové čerpadlá) — životné súčty ZAP-udalostí izolačného aj bypass stykača
# (TUV aj podlaha) a stykačov obehových čerpadiel (TUV aj podlaha), spolu 6×.
# Cieľ: neskôr vyhodnotiť podľa dní/týždňov, ktoré stykače sa spínajú
# najviac/zbytočne často (napr. FVE hysteréza kmitá, Daikin bypass TUV beží
# nočnou legionellou oveľa častejšie než čakané, alebo čerpadlo obehu cykluje
# priveľmi krátko — súvisí s otvoreným bodom "vlastná hysteréza/min. čas
# zapnutia čerpadiel" v TODO_fve_diverter.md).
# ⚠️ Zámerne BEZ vlastného priameho zápisu z ESP32 do InfluxDB (žiadny nový
# http_request/token na tomto zariadení) — tieto sensor entity idú ako
# ktorákoľvek iná entita cez ESPHome API do HA a odtiaľ ich HA existujúca
# InfluxDB integrácia zrkadlí ďalej (rovnaký mechanizmus ako pri všetkých
# ostatných HA entitách, potvrdené v `fve_eval_lib.py` schémou entity_id/value).
# Časová stopa nie je samostatné pole — je to timestamp bodu v InfluxDB v
# momente zápisu (state_changed pri každom prírastku), presne to, čo treba pre
# neskoršie zoskupenie podľa dňa/týždňa. `state_class: total_increasing`
# (monotónny čítač, nikdy sa nevracia dozadu okrem reštartu čítača) — HA/Influx
# to vie správne agregovať cez `sum`/derivačné funkcie namiesto priemerovania.
# TODO (pri oživení): tento súčet zahŕňa aj testovacie/manuálne prepnutia z HA
# počas stavania na stole — pred vyhodnotením „koľko sa spína v prevádzke"
# poznačiť si stav počítadiel v momente uvedenia do ostrej prevádzky ako baseline.
# 2026-11-10: senzory majú `lambda` + `update_interval: 60s` — po reštarte/OTA
# hneď pošlú uložený súčet (predtým „unknown“, kým sa relé znova nezoplo).
# Globály sa do flash zapisujú raz za minútu len pri zmene (ESPHome default
# flash_write_interval) — NVS 384 KB s rozkladaním zápisov, opotrebenie nehrozí.
# ----------------------------------------------------------------------------
  - platform: template
    name: "Počet zopnutí — stykač TUV"
    id: pocet_zopnuti_stykac_tuv
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_stykac_tuv);
    update_interval: 60s

  - platform: template
    name: "Počet zopnutí — bypass TUV"
    id: pocet_zopnuti_bypass_tuv
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_bypass_tuv);
    update_interval: 60s

  - platform: template
    name: "Počet zopnutí — stykač podlaha"
    id: pocet_zopnuti_stykac_podlaha
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_stykac_podlaha);
    update_interval: 60s

  - platform: template
    name: "Počet zopnutí — bypass podlaha"
    id: pocet_zopnuti_bypass_podlaha
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_bypass_podlaha);
    update_interval: 60s

  - platform: template
    name: "Počet zopnutí — stykač obeh TUV"
    id: pocet_zopnuti_stykac_obeh_tuv
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_stykac_obeh_tuv);
    update_interval: 60s

  - platform: template
    name: "Počet zopnutí — stykač obeh podlaha"
    id: pocet_zopnuti_stykac_obeh_podlaha
    icon: mdi:counter
    unit_of_measurement: "×"
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(cnt_stykac_obeh_podlaha);
    update_interval: 60s

# ----------------------------------------------------------------------------
# STAV REGULÁCIE PRE HA (2026-11-09) — čítajú globály, ktoré plní regulačná
# slučka (zatiaľ zakomentovaná → do oživenia ukazujú 0). HA z nich robí pomalé
# rozhodnutia (Daikin, Tech M-9R) — pozri home-assistant/packages/
# fve_strategia.yaml. update_interval 15 s zámerne (nie každý 3 s cyklus) —
# menej zápisov do HA/InfluxDB, HA rozhodnutia aj tak pracujú v minútach.
# ----------------------------------------------------------------------------
  - platform: template
    name: "Prebytok dostupný"
    id: fve_prebytok_dostupny
    icon: mdi:solar-power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(prebytok_W);

  - platform: template
    name: "Diverter výkon (cieľ)"
    id: diverter_vykon_ciel
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(total_duty_W);

  - platform: template
    name: "Výkon TUV"
    id: vykon_tuv_pct
    icon: mdi:water-boiler
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(duty_tuv_pub) * 100.0f;

  - platform: template
    name: "Výkon podlaha"
    id: vykon_podlaha_pct
    icon: mdi:heating-coil
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(duty_pod_pub) * 100.0f;

# ----------------------------------------------------------------------------
# DIAGNOSTIKA REGULÁCIE (2026-11-15) — všetko ide cez HA do InfluxDB, aby sa
# dalo neskôr vyhodnotiť, prečo regulácia spravila to, čo spravila.
# ----------------------------------------------------------------------------
  - platform: template
    name: "Prípojka Shelly (ESP)"
    id: shelly_siet_esp
    icon: mdi:transmission-tower
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(shelly_last_ms) == 0 || millis() - id(shelly_last_ms) > 15000) return NAN;
      return id(grid_power);

  - platform: template
    name: "Solax cloud — vek údaja"
    icon: mdi:timer-sand
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(solax_vek_s) > 99000 ? NAN : id(solax_vek_s);

  - platform: template
    name: "Regulácia — cieľ podľa Solaxu"
    icon: mdi:target
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(ciel_solax_W);

  - platform: template
    name: "Ventilátor skrine — výkon"
    icon: mdi:fan
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(fan_skrine_pct);

# ----------------------------------------------------------------------------
# POČÍTADLÁ ENERGIE (2026-11-15) — ODHAD z úrovne dimmera × menovitý výkon
# špirály (nemeriame prúd). Denné súčty (reset o polnoci) + celkové súčty,
# uložené vo flash. Týždeň/mesiac robí HA (utility_meter), všetko ide do InfluxDB.
# TUV zvlášť: špirála (FVE/manuál) a bypass na žiadosť Daikinu (K3M).
# ----------------------------------------------------------------------------
  - platform: template
    name: "Výkon do TUV (odhad)"
    id: vykon_tuv_odhad
    icon: mdi:water-boiler
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(p_odhad_tuv);
  - platform: template
    name: "Výkon do TUV — Daikin K3M (odhad)"
    id: vykon_tuv_daikin_odhad
    icon: mdi:heat-pump
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(p_odhad_tuv_daikin);
  # K3M rozdelené podľa Shelly (2026-11-16): zo siete = odber zo siete v tej chvíli,
  # najviac výkon špirály; zo slnka = zvyšok. Počíta sa každé 2 s (interval pri
  # Shelly), tu PRIEMER za posledných 10 s. Batériu nevidíme — keď menič dorovnáva
  # z batérie, Shelly ukáže ~0 a ráta sa to ako „zo slnka“. Bez merania → zo siete.
  - platform: template
    name: "Výkon do TUV — K3M zo siete (odhad)"
    id: vykon_k3m_siet
    icon: mdi:transmission-tower-import
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      static uint32_t pred = millis();
      uint32_t n = millis();
      float dt = (n - pred) / 1000.0f;
      pred = n;
      float p = dt > 0.5f ? id(k3m_siet_Ws) / dt : 0.0f;
      id(k3m_siet_Ws) = 0.0f;
      return p;
  - platform: template
    name: "Výkon do TUV — K3M zo slnka (odhad)"
    id: vykon_k3m_slnko
    icon: mdi:solar-power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      static uint32_t pred = millis();
      uint32_t n = millis();
      float dt = (n - pred) / 1000.0f;
      pred = n;
      float p = dt > 0.5f ? id(k3m_slnko_Ws) / dt : 0.0f;
      id(k3m_slnko_Ws) = 0.0f;
      return p;
  - platform: template
    name: "Výkon do podlahy (odhad)"
    id: vykon_pod_odhad
    icon: mdi:heating-coil
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(p_odhad_pod);
  # Celkové súčty (nikdy sa nenulujú, uložené vo flash) — z nich HA robí týždenné
  # a mesačné súčty (utility_meter v packages/fve_energia.yaml).
  - platform: integration
    name: "Energia do TUV celkom"
    sensor: vykon_tuv_odhad
    time_unit: h
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: integration
    name: "Energia do TUV — Daikin K3M celkom"
    sensor: vykon_tuv_daikin_odhad
    time_unit: h
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: integration
    name: "Energia do TUV — K3M zo siete celkom"
    sensor: vykon_k3m_siet
    time_unit: h
    integration_method: right     # hodnota = priemer za uplynulých 10 s
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: integration
    name: "Energia do TUV — K3M zo slnka celkom"
    sensor: vykon_k3m_slnko
    time_unit: h
    integration_method: right
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: integration
    name: "Energia do podlahy celkom"
    sensor: vykon_pod_odhad
    time_unit: h
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: "Energia do TUV dnes"
    power_id: vykon_tuv_odhad
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: "Energia do TUV — Daikin K3M dnes"
    power_id: vykon_tuv_daikin_odhad
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: "Energia do TUV — K3M zo siete dnes"
    power_id: vykon_k3m_siet
    method: right
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: "Energia do TUV — K3M zo slnka dnes"
    power_id: vykon_k3m_slnko
    method: right
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
  - platform: total_daily_energy
    name: "Energia do podlahy dnes"
    power_id: vykon_pod_odhad
    restore: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: wifi_signal
    name: "WiFi signál"
    update_interval: 60s
  - platform: uptime
    name: "Čas od zapnutia"
    update_interval: 60s

