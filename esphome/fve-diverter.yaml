# Automatika fanov na doskách dimmerov podľa teploty TRIAC-u: v regulácii (2026-11-15).

# -- Ventilátor skrine — Tacho (RPM spätná väzba, 2026-11-05) ----------------
# 4-vodičový PC/Noctua fan, pin3 (pozri "VENTILÁTOR SKRINE" nižšie) — open-
# collector, 2 pulzy/otáčku (bežná konvencia u PC fanov, over pri oživení
# podľa konkrétneho modelu). `pulse_counter` reportuje pulzy/min, `multiply:
# 0.5` prepočíta na RPM. Interný pull-up (fan ťahá signál na GND pri pulze).
# GPIO22 (od 2026-11-10, predtým GPIO4) — vedľa PWM GPIO23, oba vodiče fanu
# skrine (PWM + tacho) na susedných pinoch. Pull-up len na 3,3 V (interný),
# nikdy nie na 5 V.
  # Prietokomer TUV (GPIO4) — len interné počítadlo pulzov pre „Odber teplej
  # vody TUV“ (binary_sensor nižšie). Do HA nejde, l/min sa nekalibruje.
  - platform: pulse_counter
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true            # + externý R6 4,7 kΩ na 3,3 V
    id: prietok_pulzy
    internal: true
    update_interval: 2s
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE

  - platform: pulse_counter
    pin:
      number: GPIO22
      mode:
        input: true
        pullup: true
    name: "Ventilátor skrine — otáčky"
    id: fan_tacho_rpm
    update_interval: 5s         # default 60 s → otáčky by meškali o minútu
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    filters:
      - multiply: 0.5

# ============================================================================
# BINÁRNE VSTUPY
# ============================================================================
binary_sensor:
  # Okno FVE / slnečný deň (2026-11-16) — podľa nich sa riadi aj HA stratégia
  # (packages/fve_strategia.yaml: Daikin slnečný režim, blokovanie TUV).
  - platform: template
    name: "Okno FVE"
    icon: mdi:sun-clock
    lambda: return id(v_okne_g);
  - platform: template
    name: "Slnečný deň"
    icon: mdi:weather-sunny
    lambda: return id(slnecny_den_g);
  # Stav relé len na zobrazenie v HA (relé samotné sú v ostrej verzii internal —
  # substitúcia rele_internal). Rovnaký názov ako pôvodné prepínače.
  - platform: template
    name: "Stykač TUV (cievka)"
    id: stykac_tuv_stav
    device_class: power
    lambda: return id(stykac_tuv).state;
  - platform: template
    name: "Bypass stykač TUV (cievka)"
    id: bypass_tuv_stav
    device_class: power
    lambda: return id(bypass_tuv).state;
  - platform: template
    name: "Stykač podlaha (cievka)"
    id: stykac_podlaha_stav
    device_class: power
    lambda: return id(stykac_podlaha).state;
  - platform: template
    name: "Bypass stykač podlaha (cievka)"
    id: bypass_podlaha_stav
    device_class: power
    lambda: return id(bypass_podlaha).state;
  - platform: template
    name: "Čerpadlo TUV"
    id: cerpadlo_tuv_stav
    device_class: running
    lambda: return id(cerpadlo_tuv).state;
  - platform: template
    name: "Čerpadlo podlaha"
    id: cerpadlo_podlaha_stav
    device_class: running
    lambda: return id(cerpadlo_podlaha).state;
  - platform: template
    name: "Fan TRIAC TUV (dimmer doska)"
    id: fan_dimmer_tuv_stav
    device_class: running
    lambda: return id(fan_dimmer_tuv).state;
  - platform: template
    name: "Fan TRIAC podlaha (dimmer doska)"
    id: fan_dimmer_podlaha_stav
    device_class: running
    lambda: return id(fan_dimmer_podlaha).state;

  # Prietok studenej vody do zásobníka TUV = práve sa odoberá teplá voda.
  # GPIO4 (Hall snímač z TECH EU-11, napájaný 3,3 V, R6 4,7 kΩ pull-up).
  # Snímač dáva pri tečení pulzy (~5 Hz), v kľude stojí na náhodnej úrovni
  # (podľa polohy kolieska) → stav sa odvodzuje z POČTU pulzov (prietok_pulzy),
  # nie z úrovne pinu. l/min netreba (2026-11-15) — len ide / nejde.
  # ON  = aspoň 2 pulzy za 2 s (> 30 pulzov/min)
  # OFF = 10 s bez pulzov (krátke prerušenie pri miešaní vody nezhasne)
  - platform: template
    name: "Odber teplej vody TUV"
    id: odber_tuv
    device_class: running
    icon: mdi:water-pump
    lambda: |-
      return id(prietok_pulzy).state > 30;
    filters:
      - delayed_off: 10s
    on_state:
      - text_sensor.template.publish:
          id: odber_tuv_txt
          state: !lambda 'return x ? std::string("ide") : std::string("nejde");'

  # OPTO vstup: Daikin žiada zapnúť obehové čerpadlo podlahy (galv. izolované).
  # NOVÁ funkcia — TechController ECO s podlahou nikdy nič nemal, nie je to
  # jeho náhrada. Overiť pri Daikin dni, odkiaľ presne ide toto napätie
  # (priamo z Daikinovho relé) — pozri TODO_fve_diverter.md.
  # GPIO27 od 2026-11-10 (predtým GPIO13) — oba Daikin signály vedľa seba
  # (27 + 14), pri relé čerpadiel (25 + 26).
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true            # interný pull-up (open-collector opto)
      inverted: true            # over polaritu opta pri oživení
    filters:                    # debounce (dlhý kábel, AC opto modul) — overené v subtanku
      - delayed_on: 500ms
      - delayed_off: 500ms
    name: "Daikin žiada čerpadlo podlahy"
    id: daikin_ziada_cerpadlo
    # OPRAVA 2026-11-16: bez toho sa on_state pri PRVOM stave po štarte nespustil →
    # po každom reštarte/OTA ostalo čerpadlo (režim Auto) vypnuté, kým Daikin
    # nezmenil signál (dnes minúty, pri trvalej požiadavke aj hodiny).
    trigger_on_initial_state: true
    on_state:
      - script.execute: cerpadlo_podlaha_aplikuj

  # Daikin žiada ohrev TUV pomocným ohrevom (BSH) — ZMENA 2026-11-10: NIE suchý
  # kontakt, ale AC 230 V opto modul PARALELNE na cievku stykača K3M v hydroboxe
  # (EHBH08DA9W7, svorky A1/A2). Napätie na cievke = Daikin chce BSH (napr.
  # ručne „performance“ v Daikin appke, legionella, TČ nestíha). Dôvod: hlavné
  # kontakty K3M sú silové (pri 3,3 V / mA spínajú nespoľahlivo) a sú v 230/400 V
  # rozvodnici. 2-kanálový AC opto modul: kanál 1 = K3M cievka → GPIO14, kanál 2 =
  # čerpadlo podlahy → GPIO27. Modul NIE PC817 DC modul (3,3–12 V vstup)!
  # Kým modul nie je zapojený: GPIO14 visí na pull-upe = „nežiada“ (bezpečné).
  # Logika (zakomentovaná regulácia, „DAIKIN BACKUP OHREV TUV“): žiada → ESP
  # zopne LEN bypass stykač TUV priamo (3 kW naplno, bez ohľadu na FVE), limit
  # max_t_tuv; pri výpadku teplomera TUV ide aj tak (stráži Daikin). GPIO14 pri
  # štarte ESP krátko vysiela signál (JTAG MTMS) — pri opto výstupe neškodí
  # (tranzistor optočlena obmedzí prúd), sériový rezistor NETREBA (zrušený
  # 2026-11-13). VCC opto modulu = 3,3 V (nie 5 V — jeho pull-up by dal 5 V na pin).
  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true            # interný pull-up (open-collector výstup opta)
      inverted: true            # opto zopne OUT na GND = žiada; over pri oživení
    filters:                    # debounce (dlhý kábel, AC opto modul)
      - delayed_on: 500ms
      - delayed_off: 500ms
    name: "Daikin žiada ohrev TUV (bojler)"
    id: daikin_ziada_ohrev_tuv

  - platform: status
    name: "ESP pripojené"
  - platform: dimmerlink
    dimmerlink_id: dimmerlink_tuv
    update_interval: 10s
    ready:
      name: "DimmerLink TUV — pripravený"
    error:
      name: "DimmerLink TUV — chyba"
    calibration_done:
      name: "DimmerLink TUV — kalibrácia hotová"
  - platform: dimmerlink
    dimmerlink_id: dimmerlink_podlaha
    update_interval: 10s
    ready:
      name: "DimmerLink podlaha — pripravený"
    error:
      name: "DimmerLink podlaha — chyba"
    calibration_done:
      name: "DimmerLink podlaha — kalibrácia hotová"

  # Relácia ohrevu podlahy z FVE (2026-11-09) — ON od prvého prebytku do podlahy
  # až po dosiahnutie max teploty / koniec dňa / zmenu režimu. Počas nej beží
  # čerpadlo podlahy nepretržite. HA podľa jej konca vracia Tech M-9R zóny.
  - platform: template
    name: "Ohrev podlahy z FVE"
    id: ohrev_podlahy_fve
    lambda: return id(pod_relacia);

# ============================================================================
# RELÉ — 3× samostatný 2-kanálový modul (active-LOW) — bezpečný default = VYP
# ============================================================================
# Zoskupené podľa fyzického modulu (viď schéma): TUV(17+16), podlaha(19+18),
# čerpadlá(26 TUV + 25 podlaha — vedľa seba, od 2026-11-10). Bypass
# stykač je PARALELNE k TRIAC-u (GATE), nie sériovo — viď PI slučka nižšie
# pre ZOP/ROZ logiku.
# ⚠️ Preskupené 2026-11-04 (pôvodne TUV 17+13, podlaha 18+5, čerpadlá 19+23)
# — dôvod: uvoľnenie GPIO13/14/26 pre I2C a Daikin signály, fyzicky susedné
# páry izolačný+bypass na pravej strane ESP32.
# ⚠️ Preskupené 2026-11-10 (pinout ../docs/schematics/esp32_pinout_zapojenie.png):
# čerpadlá 14→26 (TUV) a 33→25 (podlaha). GPIO14 pri štarte vysiela signál →
# relé by mohlo cuknúť; 25/26 to nerobia. GPIO12 (strapping) nikdy.
switch:
  # -- 2-kan. modul: TUV (izolačný stykač + bypass stykač) --------------------
  - platform: gpio
    pin: GPIO17
    name: "Stykač TUV (cievka)"
    id: stykac_tuv
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_stykac_tuv)++;
          id(pocet_zopnuti_stykac_tuv).publish_state(id(cnt_stykac_tuv));

  - platform: gpio
    pin: GPIO16
    name: "Bypass stykač TUV (cievka)"
    id: bypass_tuv
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_bypass_tuv)++;
          id(pocet_zopnuti_bypass_tuv).publish_state(id(cnt_bypass_tuv));

  # -- 2-kan. modul: podlaha (izolačný stykač + bypass stykač) ----------------
  - platform: gpio
    pin: GPIO19
    name: "Stykač podlaha (cievka)"
    id: stykac_podlaha
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_stykac_podlaha)++;
          id(pocet_zopnuti_stykac_podlaha).publish_state(id(cnt_stykac_podlaha));

  - platform: gpio
    pin: GPIO18
    name: "Bypass stykač podlaha (cievka)"
    id: bypass_podlaha
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_bypass_podlaha)++;
          id(pocet_zopnuti_bypass_podlaha).publish_state(id(cnt_bypass_podlaha));

  # -- 2-kan. modul: čerpadlá ---------------------------------------------------
  - platform: gpio
    pin: GPIO26
    name: "Čerpadlo TUV"
    id: cerpadlo_tuv
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_stykac_obeh_tuv)++;
          id(pocet_zopnuti_stykac_obeh_tuv).publish_state(id(cnt_stykac_obeh_tuv));

  # ⚠️ GPIO12 zámerne NEpoužité (strapping pin, volí napäťovú úroveň flash pri
  # boote — relé modul "bezpečný default VYP" pravdepodobne pri boote drží
  # tento pin HIGH, čo by vynútilo 1,8V flash a zabránilo bootu).
  # Pozn. 2026-11-10: relé čerpadla pri VYP slabo svietilo — príčina bola, že
  # vodič bol fyzicky ešte podľa starého zapojenia na GPIO12 (YAML ho vôbec
  # nepoužíva, pin „visel“). GPIO5 vadný NIE JE (neoverený, ostáva voľný).
  # Čerpadlo podlahy na kontakte relé **NO** (2026-11-14 user: NC skúšané a
  # vrátené späť na NO). Relé zopnuté = čerpadlo beží. Pri reštarte/výpadku ESP
  # čerpadlo STOJÍ, kým ho script po boote znova nezapne (pár sekúnd).
  # Ovláda ho LEN script `cerpadlo_podlaha_aplikuj` podľa selectu
  # „Čerpadlo podlaha — režim“; ručné prepnutie switchu v HA platí len do
  # najbližšej udalosti (zmena režimu / Daikin signálu / boot).
  - platform: gpio
    pin: GPIO25
    name: "Čerpadlo podlaha"
    id: cerpadlo_podlaha
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF
    inverted: true
    on_turn_on:
      - lambda: |-
          id(cnt_stykac_obeh_podlaha)++;
          id(pocet_zopnuti_stykac_obeh_podlaha).publish_state(id(cnt_stykac_obeh_podlaha));

  # -- Fan na doskách dimmerov (2026-09-13, rbdimmer 40A-CS) -------------------
  # NIE ako skriňový fan (GPIO23, PWM priamo na 4. pin fanu) — tu ide priamo logický
  # signál na `FAN` pin dosky (červená/oranžová skupina na konektore, vedľa
  # TEMP/CUR-S). Podľa dokumentácie rbdimmerThermalESP32 (GitHub,
  # robotdyn-dimmer) má doska VLASTNÝ tranzistor, `FAN` je len jeho logický
  # vstup ("low-current logic signal, can connect to any GPIO") — netreba
  # externý MOSFET ako pri skriňovom fane. On/off, NIE PWM (fan má len 2
  # vodiče, žiadny PWM vstup na fane samotnom).
  # ⚠️ Neoverené z datasheetu (len z knižničnej dokumentácie) — pri oživení
  # overiť multimetrom/oscilom: logický prah, polaritu (predpoklad: active-HIGH,
  # `inverted` nižšie preto nie je nastavené), max. prúd z GPIO ktorý pin znesie.
  # GPIO34/35/36/39 sú HW input-only, nemôžu riadiť fan (výstup). Od
  # 2026-11-10: FAN TUV = GPIO33, FAN podlaha = GPIO32 (vedľa GPIO34/35 →
  # rbdimmer2 má TEMP/CUR-S/FAN na 3 susedných pinoch).
  - platform: gpio
    pin: GPIO33
    name: "Fan TRIAC TUV (dimmer doska)"
    id: fan_dimmer_tuv
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO32
    name: "Fan TRIAC podlaha (dimmer doska)"
    id: fan_dimmer_podlaha
    internal: ${rele_internal}
    restore_mode: ALWAYS_OFF

  # -- Ventilátor skrine — ZÁLOŽNÉ relé na VCC — ZRUŠENÉ (2026-11-10) ----------
  # Test 2026-11-10: súčasný fan sa pri PWM 0 % / OFF naozaj zastaví → relé
  # netreba, VCC fanu ide priamo na 5 V (Mean Well). REZERVA pre prípad výmeny
  # fanu za kus, ktorý sa pri 0 % PWM nezastaví:
  #   - relé modul (active-LOW, VCC 3,3 V, JD-VCC 5 V, jumper vybratý) IN →
  #     GPIO13 (rezervovaný, voľný), kontakt COM/NO do VCC vetvy fanu (5 V)
  #   - odkomentovať blok nižšie (default ZAP = fan napájaný), v PI slučke
  #     prípadne vypínať pri fan_duty == 0
  # - platform: gpio
  #   pin: GPIO13
  #   name: "Ventilátor skrine — záložný vypínač napájania"
  #   id: fan_power_cutoff
  #   restore_mode: ALWAYS_ON
  #   inverted: true

  # -- Voľba: TEMP dosiek dimmerov zapojený (2026-11-15) -------------------------
  # ZAP až keď sú TEMP vodiče + pull-upy R4/R5 zapojené — potom fany na doskách
  # aj podľa teploty (≥ 50 °C ZAP, < 45 °C VYP) a ochrana TRIAC-u (≥ 80 °C →
  # výkon daného dimmera 0, späť pod 70 °C). VYP = fany len podľa behu dimmera.
  - platform: template
    name: "Teplota TRIAC — zapojená"
    id: teplota_triac_zapojena
    icon: mdi:thermometer-check
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # -- Voľba (nie relé): obeh TUV počas ohrevu (2026-11-09) ----------------------
  # ZAP = čerpadlo TUV beží pri každom ohreve TUV špirálou/Daikin bypassom (+5 min
  # dobeh). Default VYP. Bojler obeh nepotrebuje — zmysel má len keď sme doma
  # (teplá voda hneď v potrubí), preto ho HA prepína automaticky podľa víkendu/
  # sviatku/prázdnin (fve_strategia.yaml, 3b); bez HA ostane posledný stav.
  # Nezávisle od toho sa obeh zapne automaticky pri horúcej TUV cez slnko
  # (prah "Čerpadlo TUV — auto od teploty", default 70 °C).
  - platform: template
    name: "Čerpadlo TUV počas ohrevu"
    id: cerpadlo_tuv_pri_ohreve
    icon: mdi:pump
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# ============================================================================
# TRIAC DIMMERY (rbdimmer 40A) — riadené cez DimmerLink (I2C, hardvérový Z-C/firing)
# ============================================================================
# Rozhodnutie 2026-08-27: DimmerLink je PRIMÁRNE riešenie (nie ac_dimmer natívny
# GPIO, nie "alternatíva/TODO") — už kúpené 2× DimmerLink 1CH, každý na vlastnú
# fázu, vlastný hardvérový Z-C (Cortex-M+, bez softvérového jitteru na ESP32).
# Máme aj 1× DimmerLink 2CH (kúpený skôr) — NEZAPOJENÝ, len záložný diel (1
# zdieľaný Z-C pre oba kanály sa pre 2 rôzne fázy nehodí, viď schéma).
# GPIO21/22 obsadené (OneWire, tacho fanu skrine) → I2C na GPIO2 (SDA) / GPIO15 (SCL).
# Presunuté 2026-11-04 z GPIO26/14 (tie teraz nesú čerpadlo TUV a Daikin
# signály) na GPIO2/15 — uvoľnené z fan_dimmer_tuv/podlaha switchov, ktoré sa
# presunuli na GPIO32/25. GPIO2/15 sú strapping piny, ale len ako I2C idle-HIGH
# (externé pull-upy), rovnaký princíp ako prečo tento projekt už bežne používa
# GPIO2/5/15 ako výstupy bez problémov (pozri switch sekciu vyššie).
# ADRESY (od 2026-11-16): TUV 0x54, podlaha 0x53. 0x50 sa nechá VOĽNÁ — všetky
# moduly rbdimmer (DimmerLink, rbAmp) majú z výroby 0x50, nový modul sa tak dá
# pripojiť bez kolízie a adresu mu zmeniť priamo v skrini. 0x52/0x51 = rbAmp TUV/podlaha
# (plán). Pôvodne 0x50/0x51 (do 2026-11-16). Náhradný DimmerLink: v testovacej verzii
# tlačidlá „nový DimmerLink 0x50 → 0x54 / 0x53“.
# (Adresa sa mení zápisom do registra 0x30, zmena je OKAMŽITÁ a ukladá sa do
# EEPROM — potvrdené z oficiálnej dokumentácie rbdimmer.com/docs/dimmerlink-*,
# 2026-11-06.)
# ----------------------------------------------------------------------------
# ZAPOJENIE (overené oproti oficiálnej dokumentácii DimmerLink, 2026-11-06):
# Vstupný konektor DimmerLink (ten, čo ide do ESP32) má 4 piny — VCC, GND a
# DVA dátové piny, ktoré sú na doske popísané DVOJMO (UART aj I2C popis pre
# ten istý fyzický pin, modul si protokol vie sám prepnúť, netreba iné
# zapojenie): pin "TX/SDA" → GPIO2, pin "RX/SCL" → GPIO15. T.j. nezamieňať si
# "TX/RX" na obrázku dosky za potrebu UART zapojenia — pri I2C ide presne na
# tie isté 2 piny ako by išlo UART, len sa použijú ako SDA/SCL.
# ⚠️ POVINNÝ externý pull-up: 4,7 kΩ na SDA aj SCL smerom k 3,3V — JEDEN
# spoločný set pre CELÚ zbernicu (obe DimmerLink dosky), nie samostatne pre
# každú. Interné pull-upy ESP32 sú na toto príliš slabé (dokumentácia to
# uvádza explicitne pre ESP32/ESP8266). Bez neho hrozí presne to, čo vidno
# v logu pri odpojených moduloch: "Communication failed!" na I2C scane.
# Odporúčanie z dokumentácie navyše: káble pod 30 cm, 100 nF kondenzátor
# VCC-GND tesne pri každom DimmerLinku.
# Fyzicky na doštičke ESP32 (pasívny pin-header + skrutková svorkovnica,
# obe na rovnakom GPIO nete — rovnaký typ ako inde v projekte): na GPIO2 aj
# GPIO15 sa stretávajú 3 vodiče (2× DimmerLink SDA/SCL + 1× nožička
# rezistora) — nedá sa dať všetko pod jednu skrutku rozumne, preto:
#   - rezistor (tuhá nožička) → zasúvací pin header
#   - oba DimmerLink vodiče (SDA spolu, SCL spolu) → skrutková svorkovnica,
#     najprv zopnuté/skrútené spolu (prípadne dutinka-ferrule), nie len
#     voľne rozstrapkané lanko pod jednou skrutkou
# (2026-11-06, dohodnuté s userom pri fyzickom zapájaní na stole)
# Výstupný konektor DimmerLink (ten, čo ide do rbdimmer dosky) je samostatný
# pre KAŽDÝ modul (nezdieľa sa): VCC, GND, Z-C, Dim → na rbdimmer dosku piny
# Z-C a DIM/Gate (pozri "DETAIL" panel v schéme).
# ----------------------------------------------------------------------------
# Komponent je LOKÁLNA KÓPIA (components/dimmerlink) z github://robotdyn-dimmer/
# DimmerLink@main, commit 2d4e425 (2026-08-16), s opravou čítania registrov
# (STOP medzi zápisom registra a čítaním — viď komentár v dimmerlink.cpp).
external_components:
  - source:
      type: local
      path: components
    components: [dimmerlink]

i2c:
  id: i2c_bus                  # testovacia verzia: I2C scan + zmena adresy DimmerLinku
  sda: GPIO2
  scl: GPIO15

dimmerlink:
  - id: dimmerlink_tuv
    address: 0x54          # DimmerLink1 — Z-C ← L1, GATE rbdimmer1 ← DIM0 (TUV 3 kW); do 2026-11-16 0x50
  - id: dimmerlink_podlaha
    address: 0x53          # DimmerLink2 — Z-C ← L2, GATE rbdimmer2 ← DIM0 (podlaha 600 W); do 2026-11-16 0x51

# default_transition_length: 0s — komponent má default 1 s (overené v zdrojáku
# DimmerLink light.py, 2026-11-09); pre fázové riadenie špirál nechceme žiadne
# plynulé prechody (regulácia počíta s okamžitou zmenou úrovne).
# restore_mode: ALWAYS_OFF (2026-11-10) — ESPHome default RESTORE_DEFAULT_OFF by
# po reštarte počas ohrevu obnovil poslednú úroveň (napr. 70 %) → v rozpore so
# zásadou „štart na duty 0“; navyše by sa úroveň pri regulácii zbytočne
# ukladala do flash. Po boote vždy VYP, regulácia nabehne od nuly.
light:
  - platform: dimmerlink
    dimmerlink_id: dimmerlink_tuv
    id: dimmer_tuv
    name: "Dimmer TUV"
    default_transition_length: 0s
    gamma_correct: 1.0           # úroveň = presne to, čo pošle regulácia
    restore_mode: ALWAYS_OFF
  - platform: dimmerlink
    dimmerlink_id: dimmerlink_podlaha
    id: dimmer_podlaha
    name: "Dimmer podlaha"
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: ALWAYS_OFF

# ============================================================================
# DEKOMISOVANÉ: natívny ac_dimmer (priame GPIO GATE/ZC) — nahradené DimmerLink
# vyššie. Ponechané ako referencia pre núdzový návrat, ak by DimmerLink zlyhal
# (napr. I2C komunikácia nespoľahlivá) — vtedy treba GPIO4/16 (GATE) a GPIO27/33
# (ZC) späť do schémy aj tu. min_power/method poznámky nižšie boli overené pre
# TENTO natívny prístup — pri DimmerLine sa firing rieši hardvérovo na module,
# analogický mechanizmus (ak existuje) treba dohľadať v jeho dokumentácii/FW.
# ⚠️⚠️ KOLÍZIA (2026-09-08): GPIO27 medzičasom obsadené binary_sensor
# "Daikin žiada ohrev TUV" (viď vyššie) — pri núdzovom návrate na ac_dimmer
# treba pre ZC L1 vybrať INÝ voľný pin, GPIO27 už nie je voľné.
# ⚠️⚠️ ĎALŠIA KOLÍZIA (2026-11-04): GPIO16 (pôvodne rezervované pre GATE
# podlaha nižšie) je teraz obsadené switchom "Bypass stykač TUV" (viď vyššie)
# — ale NEVADÍ: scenár "núdzový návrat" = DimmerLink sa prestáva používať,
# takže sa SAMO uvoľní I2C zbernica (GPIO2/15) — presne 2 piny na 2× GATE.
# ZC páry naďalej GPIO4 (voľné, rezervované) + GPIO33 (voľné, rezervované).
# ⚠️ 2026-11-10: po novom rozložení sú GPIO4, 27, 33 obsadené — piny v
# zakomentovanom bloku nižšie sú NEAKTUÁLNE. Pri reálnom návrate prerozdeliť
# (voľný GPIO5 + uvoľnené I2C GPIO2/15).
# T.j. nič netreba špeciálne chrániť navyše, fallback má svoje piny zaručené
# automaticky práve vtedy, keď by bol potrebný. Skutočne voľné piny k
# dnešnému dňu (2026-11-04, bez fallback úvahy): GPIO0, 1(TX0), 3(RX0), 5.
# ⚠️⚠️ ĎALŠIA KOLÍZIA (2026-11-05): GPIO4 obsadené senzorom "Ventilátor skrine
# — otáčky" (Tacho, pozri sensor: sekciu). Pri núdzovom návrate zostáva
# zaručený už len GPIO33 (ZC podlaha) — pre ZC TUV treba pri reálnom návrate
# nájsť iný pin (skutočne voľné sú už len GPIO0/1(TX0)/3(RX0)/12, všetky so
# známym rizikom — pozri README "Bezpečnostné zásady"). Neriešiť teraz,
# len si to uvedomiť, keby fallback scenár nastal.
# ----------------------------------------------------------------------------
# output:
#   - platform: ac_dimmer
#     id: dimmer_tuv
#     gate_pin: GPIO4
#     zero_cross_pin:
#       number: GPIO27
#       mode:
#         input: true
#         pullup: true
#       inverted: true            # over hranu (FALLING) pri oživení
#     method: leading             # fázové riadenie odporovej záťaže (TRIAC)
#     min_power: 0%               # doladiť na stole, typicky 10-30 % (nie 5-10 %)
#
#   - platform: ac_dimmer
#     id: dimmer_podlaha
#     gate_pin: GPIO16
#     zero_cross_pin:
#       number: GPIO33
#       mode:
#         input: true
#         pullup: true
#       inverted: true
#     method: leading
#     min_power: 0%
# ----------------------------------------------------------------------------

# ============================================================================
# VENTILÁTOR SKRINE — chladenie AC dimmerov (4-vodičový PWM fan)
# ============================================================================
# ⚠️ Prepracované 2026-11-04 (2): pôvodný plán (2-vodičový fan spínaný cez
# MOSFET modul FR120N na strane GND) ZRUŠENÝ — reálny fan má 4 vodiče
# (PC/Noctua PWM konvencia), rýchlosť rieši fan sám podľa PWM signálu na
# vlastnom 4. pine, netreba žiadny MOSFET ani iný driver na napájaciu vetvu.
# Zapojenie fanu priamo:
#   pin1 GND  → spoločná GND
#   pin2 VCC  → trvalo 5 V (Mean Well MDR-20-5) priamo. Záložné relé
#               `fan_power_cutoff` zrušené 2026-11-10 (PWM 0 % fan zastaví) —
#               rezerva GPIO13, pozri zakomentovaný blok v switch sekcii
#   pin3 Tacho → GPIO22 (pulse_counter senzor "fan_tacho_rpm", pozri sensor:
#               sekciu vyššie, interný pull-up) — od 2026-11-10 (predtým GPIO4)
#   pin4 PWM  → priamo GPIO23 (ESP32 3.3V logika, fan má interný pull-up
#               na PWM vstupe — over multimetrom/oscilom pri oživení, že
#               3,3V level fanu stačí)
# Rýchlosť = f(výkon dimmerov), NIE podľa teploty skrine — pozri fan_duty
# v PI slučke nižšie (max(duty_tuv, duty_podlaha) + krátky dobeh po vypnutí).
# ⚠️ Nezamieňať s malými ventilátormi na chladičoch samotných TRIAC dosiek
# (rbdimmer 40A-CS má vlastný FAN+5V pin, doska si svoj fan rieši úplne sama
# cez vlastný logický GPIO vstup — fan_dimmer_tuv/podlaha switche vyššie,
# GPIO33/32) — tento pin ovláda VÝHRADNE spoločný ventilátor CELEJ
# skrine, dve nezávislé funkcie, zámerne (rozhodnutie 2026-09-13).
# Presunuté 2026-11-04 z GPIO25 na GPIO23 (uvoľnené z čerpadla podlaha,
# presunutého na GPIO5; od 2026-11-10 je čerpadlo podlaha na GPIO25).
# ----------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO23
    id: fan_pwm
    frequency: 25000Hz    # nad počuteľné pásmo (bez pískania pri nízkom PWM)

# ============================================================================
# LADITEĽNÉ PARAMETRE (z HA) — ESP si ich pamätá vo flash (restore_value)
# ============================================================================
number:
  - platform: template
    name: "Max teplota TUV"
    id: max_t_tuv
    optimistic: true
    restore_value: true
    initial_value: 75
    min_value: 40
    max_value: 80
    step: 1
    unit_of_measurement: "°C"

  # Teplota VODY v podlahovom okruhu (špirála 600 W je priamo v okruhu, nie
  # v AKU nádrži) — default 35 °C (rozhodnutie 2026-11-09). Premenované z
  # "Max teplota podlaha (AKU)" (default 60 bol pre AKU nádrž, tú už nemáme) —
  # nové meno = nový hash v flash → po flashi naozaj naskočí 35, nie stará 60.
  - platform: template
    name: "Max teplota voda podlaha"
    id: max_t_podlaha
    optimistic: true
    restore_value: true
    initial_value: 35
    min_value: 25
    max_value: 50
    step: 1
    unit_of_measurement: "°C"

  # Rozdelenie prebytku, keď je podlaha naplno (rozhodnutie 2026-11-09):
  # tento podiel ide do batérie, zvyšok do TUV (25 % = 1/4 batéria, 3/4 TUV).
  # Platí aj keď je batéria pod rezervou min SoC — rezervu drží menič sám
  # (nevybíja pod min SoC), takže batéria sa len nabíja svojou časťou.
  - platform: template
    name: "Podiel prebytku do batérie"
    id: podiel_baterie_pct
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: 0
    max_value: 90
    step: 5
    unit_of_measurement: "%"

  # Nad týmto SoC berieme batériu ako plnú → jej podiel ide tiež do TUV
  # (inak by "jej" časť odtiekla do siete).
  - platform: template
    name: "SoC batérie považovaná za plnú"
    id: soc_bateria_plna
    optimistic: true
    restore_value: true
    initial_value: 97
    min_value: 80
    max_value: 100
    step: 1
    unit_of_measurement: "%"

  # MANUÁLNE VYNÚTENIE výkonu (rozhodnutie 2026-09-14) — 0 = vypnuté (bežný
  # FVE/Daikin automatický režim), 10-100 = vynúť túto hodnotu duty bez ohľadu
  # na FVE prebytok/watchdog (rovnaký princíp ako Daikin — funguje aj pri
  # stale meraní). Použitie: napr. keď je výpadok siete a beží sa na
  # generátore — nastav 100 % a systém sám prejde na bypass (rovnaká ZOP
  # sekvencia ako pri FVE, TRIAC-preload, nie priama vetva ako pri Daikinovi).
  # Pri hodnotách <100 % potrebuje TRIAC vetvu, teda aj izolačný stykač
  # zopnutý — manuálny režim preto prebíja aj "deň/noc" rozvrh (keď prevezmeš
  # ručnú kontrolu, automatika ustúpi). Tepelný strop (max_t_tuv/podlaha)
  # zostáva rešpektovaný aj tu.
  # ČASOVÝ LIMIT (user 2026-11-16): manuál sa po „Manuálny výkon — časový limit“
  # (default 5 h, 1–72 h — dlhý výpadok siete) sám vráti na 0 = automatika
  # (interval „Časový limit manuálneho výkonu“) a HA pošle upozornenie (text senzor
  # „Manuálny výkon — vypršal“). Každé nastavenie hodnoty > 0 spustí odpočet
  # odznova. Po reštarte ESP je manuál VŽDY 0 (restore_value: false) — zabudnutý
  # manuál neprežije ani výpadok prúdu.
  - platform: template
    name: "TUV — manuálny výkon (0=auto)"
    id: manual_tuv_pct
    optimistic: true
    restore_value: false
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - lambda: |-
          id(manual_tuv_od_ms) = x > 0.5f ? millis() : 0;

  - platform: template
    name: "Podlaha — manuálny výkon (0=auto)"
    id: manual_podlaha_pct
    optimistic: true
    restore_value: false
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - lambda: |-
          id(manual_pod_od_ms) = x > 0.5f ? millis() : 0;

  - platform: template
    name: "Manuálny výkon — časový limit"
    id: manual_limit_h
    icon: mdi:timer-cog-outline
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 72
    step: 1
    unit_of_measurement: "h"

  # OKNO FVE + SLNEČNÝ DEŇ (2026-11-16, nahrádza pevné „Stykač deň — začiatok/koniec
  # (hodina)“ 6–20). Okno = východ + X … západ − Y. V okne sa čaká na prvý prebytok
  # ≥ prah trvajúci aspoň N min (aj keď batéria nabíja, napr. na 20 %) = „slnečný deň“
  # → až potom zopnú izolačné stykače a hreje sa, až do konca okna. Bez prebytku
  # (zamračené) nezopne nič. HA stratégia (Daikin, TUV) sa riadi tým istým.
  - platform: template
    name: "Okno FVE — začiatok po východe"
    id: okno_po_vychode_min
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_value: true
    initial_value: 120
    min_value: 0
    max_value: 360
    step: 10
    mode: box
    unit_of_measurement: "min"

  - platform: template
    name: "Okno FVE — koniec pred západom"
    id: okno_pred_zapadom_min
    icon: mdi:weather-sunset-down
    optimistic: true
    restore_value: true
    initial_value: 120
    min_value: -60
    max_value: 360
    step: 10
    mode: box
    unit_of_measurement: "min"

  - platform: template
    name: "Slnečný deň — prah prebytku"
    id: slnecny_den_prah_w
    icon: mdi:weather-sunny
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 0
    max_value: 3000
    step: 50
    mode: box
    unit_of_measurement: "W"

  - platform: template
    name: "Slnečný deň — trvanie prebytku"
    id: slnecny_den_trvanie_min
    icon: mdi:timer-sand
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    unit_of_measurement: "min"

  # Čerpadlo TUV — 2 nezávislé "komfortné" dôvody navyše k FVE/Daikin hrievaniu
  # (rozhodnutie 2026-09-13/2026-09-14, viď TODO_fve_diverter.md — vzor TECH
  # EU-11 "Eco Circulation", ktorý ESP32 nahrádza; oba rozdielové — bojler
  # PRIAMO voči vratnej vode, nie proti pevnému číslu ako originál):
  #   #2 ODBER: prietok A (bojler−vratná) > delta_tuv_cerpadlo → beh na pevný
  #      čas (cerpadlo_tuv_operation_min) — zrýchli teplú vodu na kohútiku.
  #   #3 ÚDRŽBA: (bojler−vratná) > delta_tuv_udrzba, BEZ ohľadu na odber →
  #      beh KONTINUÁLNE kým rozdiel neklesne pod (delta_tuv_udrzba − 1°C) —
  #      udržuje teplú vodu v systéme priebežne (namiesto behu čerpadla 24/7).
  # Oba zdieľajú rovnaké časové okno nižšie (mimo okna sa ani jeden nespúšťa).
  # Defaulty NEOVERENÉ — doladiť pri oživení podľa reálneho správania.
  - platform: template
    name: "Čerpadlo TUV — prah rozdielu pri odbere (bojler − vratná)"
    id: delta_tuv_cerpadlo
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 2
    max_value: 15
    step: 1
    unit_of_measurement: "°C"

  - platform: template
    name: "Čerpadlo TUV — dĺžka behu po odbere"
    id: cerpadlo_tuv_operation_min
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 15
    step: 1
    unit_of_measurement: "min"

  - platform: template
    name: "Čerpadlo TUV — prah rozdielu pre údržbu (bojler − vratná)"
    id: delta_tuv_udrzba
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 1
    max_value: 10
    step: 1
    unit_of_measurement: "°C"

  # #4 (2026-11-09): bojler ≥ tento prah → obeh TUV beží automaticky, kým svieti
  # slnko (hysteréza 2 °C). Rozvedie teplo do okruhu, špirála môže brať ďalej.
  - platform: template
    name: "Čerpadlo TUV — auto od teploty (slnko)"
    id: cerpadlo_tuv_horuca_t
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 50
    max_value: 80
    step: 1
    unit_of_measurement: "°C"

  # Časové okno pre dôvody #2 a #3 vyššie (na minúty od polnoci, 0-1439) —
  # osobitne všedný deň a víkend. Default 5:30-23:45 pre oba (330/1425 min).
  - platform: template
    name: "Čerpadlo TUV — okno všedný deň od"
    id: cerpadlo_tuv_okno_pracovny_od
    optimistic: true
    restore_value: true
    initial_value: 330
    min_value: 0
    max_value: 1439
    step: 5
    unit_of_measurement: "min"

  - platform: template
    name: "Čerpadlo TUV — okno všedný deň do"
    id: cerpadlo_tuv_okno_pracovny_do
    optimistic: true
    restore_value: true
    initial_value: 1425
    min_value: 0
    max_value: 1439
    step: 5
    unit_of_measurement: "min"

  - platform: template
    name: "Čerpadlo TUV — okno víkend od"
    id: cerpadlo_tuv_okno_vikend_od
    optimistic: true
    restore_value: true
    initial_value: 330
    min_value: 0
    max_value: 1439
    step: 5
    unit_of_measurement: "min"

  - platform: template
    name: "Čerpadlo TUV — okno víkend do"
    id: cerpadlo_tuv_okno_vikend_do
    optimistic: true
    restore_value: true
    initial_value: 1425
    min_value: 0
    max_value: 1439
    step: 5
    unit_of_measurement: "min"

  # --------------------------------------------------------------------------
  # LADENIE REGULÁCIE (2026-11-15) — v HA pod „Konfigurácia“ zariadenia, bez
  # nového firmvéru. Predvolené = hodnoty odsúhlasené pri nasadení.
  # --------------------------------------------------------------------------
  - platform: template
