# ============================================================================
# REŽIM KÚRENIA (2026-11-09) — žije na ESP (restore vo flash), aby regulácia
# fungovala aj bez HA; v HA je to obyčajný select, ktorý číta aj HA strategia
# (fve_strategia.yaml) pre Daikin. Poradie možností = index v regulácii
# (active_index): 0 = podlaha sa NEhreje, 1/2 = podlaha má prednosť pred TUV.
#   Vypnuté (leto)    — prebytok len do TUV + batérie
#   Len z prebytkov   — prechodné obdobie: podlaha len zo špirály, Daikin kúrenie VYP (HA)
#   Kúrenie zapnuté   — zima: Daikin kúri, cez slnko ho HA zníži/vypne, podlaha zo špirály
# ⚠️ Pri zmene poradia/textov upraviť aj fve_strategia.yaml (porovnáva texty).
# ============================================================================
select:
  - platform: template
    name: "Režim kúrenia"
    id: rezim_kurenia
    icon: mdi:radiator
    optimistic: true
    restore_value: true
    options:
      - "Vypnuté (leto)"
      - "Len z prebytkov"
      - "Kúrenie zapnuté"
    initial_option: "Vypnuté (leto)"

  # Režim čerpadla TUV (2026-11-16, user: tvrdé ZAP/VYP pri servise/zapájaní, bez ohľadu
  # na čokoľvek — aj manuál). Index: 0 Auto, 1 Trvalo ZAP, 2 VYP. Uložené vo flash.
  # Default VYP — čerpadlo TUV ešte nie je zapojené (krátke káble); po zapojení → Auto.
  # VYP/ZAP platí hneď (on_value), Auto prevezme regulácia do 5 s.
  - platform: template
    name: "Čerpadlo TUV — režim"
    id: rezim_cerpadla_tuv
    icon: mdi:pump
    optimistic: true
    restore_value: true
    options:
      - "Auto"
      - "Trvalo ZAP"
      - "VYP"
    initial_option: "VYP"
    on_value:
      - lambda: |-
          if (i == 2) { id(cerpadlo_tuv).turn_off(); ESP_LOGW("cerpadlo", "Čerpadlo TUV: režim VYP (tvrdé)"); }
          else if (i == 1) { id(cerpadlo_tuv).turn_on(); ESP_LOGW("cerpadlo", "Čerpadlo TUV: režim Trvalo ZAP"); }

  # Režim čerpadla podlahy (2026-11-14). Index: 0 Auto (Daikin), 1 Trvalo ZAP, 2 VYP.
  # VYP aj Trvalo ZAP sú tvrdé — čerpadlo zapína/vypína JEDINE script nižšie podľa
  # režimu (pri VYP podlaha z FVE ani manuálne nehreje).
  # Auto = beží, keď Daikin žiada (GPIO27) ALEBO beží ohrev podlahy z FVE
  # (pod_relacia, ostrá regulácia). Uložené vo flash → po reštarte rovnaký režim.
  - platform: template
    name: "Čerpadlo podlaha — režim"
    id: rezim_cerpadla_podlaha
    icon: mdi:pump
    optimistic: true
    restore_value: true
    options:
      - "Auto (Daikin)"
      - "Trvalo ZAP"
      - "VYP"
    initial_option: "Trvalo ZAP"
    on_value:
      - script.execute: cerpadlo_podlaha_aplikuj

# JEDINÉ miesto, ktoré zapína/vypína čerpadlo podlahy (aj ostrá regulácia ho
# len volá po zmene pod_relacia). Udalosťami: boot, zmena režimu, Daikin signál.
script:
  - id: cerpadlo_podlaha_aplikuj
    mode: queued
    then:
      - lambda: |-
          int m = (int) id(rezim_cerpadla_podlaha).active_index().value_or(1);
          bool want = (m == 1)
                      || (m == 0 && (id(daikin_ziada_cerpadlo).state || id(pod_relacia)));
          if (want != id(cerpadlo_podlaha).state) {
            ESP_LOGI("cerpadlo", "Čerpadlo podlaha → %s (režim %d, Daikin %d, FVE %d)",
                     want ? "ZAP" : "VYP", m, (int) id(daikin_ziada_cerpadlo).state,
                     (int) id(pod_relacia));
            if (want) id(cerpadlo_podlaha).turn_on(); else id(cerpadlo_podlaha).turn_off();
          }

text_sensor:
  # Okno FVE dnes, napr. „08:49–14:05 · slnečný deň od 09:22“ / „· čaká na prebytok“.
  - platform: template
    name: "Okno FVE dnes"
    icon: mdi:sun-clock-outline
    update_interval: 30s
    lambda: |-
      if (id(okno_od_ep) == 0) return std::string("—");
      std::string s = ESPTime::from_epoch_local(id(okno_od_ep)).strftime("%H:%M") + "–"
                      + ESPTime::from_epoch_local(id(okno_do_ep)).strftime("%H:%M") + " · ";
      if (id(slnecny_den_g))
        s += "slnečný deň od " + ESPTime::from_epoch_local(id(slnecny_den_od_ep)).strftime("%H:%M");
      else if (id(v_okne_g))
        s += "čaká na prebytok";
      else
        s += "mimo okna";
      return s;
  # Časy pre HA (device_class timestamp, ISO v UTC) — víkendové blokovanie TUV
  - platform: template
    name: "Okno FVE — začiatok"
    device_class: timestamp
    update_interval: 60s
    lambda: |-
      if (id(okno_od_ep) == 0) return {};
      return ESPTime::from_epoch_utc(id(okno_od_ep)).strftime("%Y-%m-%dT%H:%M:%SZ");
  - platform: template
    name: "Okno FVE — koniec"
    device_class: timestamp
    update_interval: 60s
    lambda: |-
      if (id(okno_do_ep) == 0) return {};
      return ESPTime::from_epoch_utc(id(okno_do_ep)).strftime("%Y-%m-%dT%H:%M:%SZ");
  - platform: template
    name: "Slnečný deň — od"
    device_class: timestamp
    update_interval: 60s
    lambda: |-
      if (id(slnecny_den_od_ep) == 0) return {};
      return ESPTime::from_epoch_utc(id(slnecny_den_od_ep)).strftime("%Y-%m-%dT%H:%M:%SZ");
  # Posledné vypršanie manuálneho výkonu, napr. „TUV 16.11. 14:05 (po 5 h)“.
  # HA automatizácia fve_diverter_manual_vyprsal posiela upozornenie pri zmene.
  - platform: template
    name: "Manuálny výkon — vypršal"
    id: manual_vyprsal_txt
    icon: mdi:timer-alert-outline

  # Teplá voda — odber: „ide“ / „nejde“ (z binary_sensor odber_tuv, prietokomer G4)
  - platform: template
    name: "Teplá voda — odber"
    id: odber_tuv_txt
    icon: mdi:water
    lambda: |-
      return id(odber_tuv).state ? std::string("ide") : std::string("nejde");
    update_interval: 60s

  - platform: template
    name: "Zdroj merania prebytku"
    id: zdroj_merania_txt
    icon: mdi:gauge
    update_interval: 15s
    lambda: |-
      switch (id(zdroj_merania)) {
        case 1:  return std::string("Solax dongl");
        case 2:  return std::string("len Shelly (núdzový)");
        case 3:  return std::string("Shelly + Solax cloud");
        default: return std::string("žiadny — nehreje sa");
      }

  # Posledný krok regulácie (diagnostika: prečo pridala/ubrala) — publikuje regulácia
  - platform: template
    name: "Regulácia — posledný krok"
    id: regulacia_krok_txt
    icon: mdi:math-log

  # Prečo beží čerpadlo TUV (odber / údržba / ohrev / horúca TUV / manuál / —)
  - platform: template
    name: "Čerpadlo TUV — dôvod"
    id: cerpadlo_tuv_dovod_txt
    icon: mdi:pump

  # Solax cloud — čas merania (stav HA senzora, ISO 8601) → epoch pre reguláciu
  - platform: homeassistant
    id: solax_cas_ha
    entity_id: sensor.solax_cloud_realtime
    internal: true
    on_value:
      - lambda: |-
          // "2026-11-15T14:07:01+00:00" (HA timestamp, UTC) → unix čas
          int Y, M, D, h, m, s;
          if (sscanf(x.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &m, &s) != 6) return;
          int y = Y - (M <= 2);
          int era = (y >= 0 ? y : y - 399) / 400;
          int yoe = y - era * 400;
          int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
          int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          int64_t days = (int64_t) era * 146097 + doe - 719468;
          int64_t ep = days * 86400 + h * 3600 + m * 60 + s;
          // posun časovej zóny (+HH:MM / -HH:MM), ak nie je UTC
          size_t p = x.find_last_of("+-");
          if (p != std::string::npos && p > 18) {
            int th = 0, tm = 0;
            if (sscanf(x.c_str() + p + 1, "%d:%d", &th, &tm) >= 1)
              ep -= (x[p] == '+' ? 1 : -1) * (th * 3600 + tm * 60);
          }
          id(solax_epoch) = ep;

button:
  - platform: restart
    name: "Reštart ESP"

# ============================================================================
# GLOBÁLY pre reguláciu
# ============================================================================
globals:
  - id: manual_tuv_od_ms          # kedy bol nastavený manuálny výkon TUV (0 = manuál neaktívny)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: manual_pod_od_ms          # kedy bol nastavený manuálny výkon podlaha (0 = neaktívny)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: grid_power              # výkon na prípojke zo Shelly 3EM (W); - = export
    type: float
    restore_value: false
    initial_value: '0'
  - id: shelly_last_ms          # čas posledného platného čítania Shelly
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: total_duty_W            # integrátor = cieľový výkon špirál spolu (0..3600 W)
    type: float
    restore_value: false
    initial_value: '0'
  # --- Solax (primárny zdroj, lokálny dongl) — normalizované hodnoty ---------
  - id: bat_power_W             # výkon batérie (W): + nabíja, − vybíja
    type: float
    restore_value: false
    initial_value: '0'
  - id: grid_export_W           # prípojka podľa Solaxu (W): + pretok do siete, − odber
    type: float
    restore_value: false
    initial_value: '0'
  - id: bat_soc                 # SoC batérie (%)
    type: float
    restore_value: false
    initial_value: '0'
  - id: solax_last_ms           # čas posledného platného čítania Solaxu (0 = ešte nikdy)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # --- Stav regulácie (pre HA cez template senzory) --------------------------
  - id: prebytok_W              # dostupný prebytok = nabíjanie batérie + pretok + výkon špirál
    type: float
    restore_value: false
    initial_value: '0'
  - id: duty_tuv_pub            # posledný výsledný duty TUV (0..1)
    type: float
    restore_value: false
    initial_value: '0'
  - id: duty_pod_pub            # posledný výsledný duty podlaha (0..1)
    type: float
    restore_value: false
    initial_value: '0'
  - id: zdroj_merania           # 0 = žiadny, 1 = Solax, 2 = Shelly (núdzový)
    type: int
    restore_value: false
    initial_value: '0'
  - id: tuv_full                # hysteréza max teploty TUV (2 °C)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pod_full                # hysteréza max teploty podlahy (2 °C)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pod_relacia             # relácia ohrevu podlahy (čerpadlo beží nepretržite)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cerpadlo_tuv_ohrev_until_ms  # obeh TUV počas ohrevu — dobeh do kedy
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: cerpadlo_tuv_horuca_active   # obeh TUV pri horúcej TUV cez slnko (hysteréza)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: okno_od_ep              # okno FVE dnes — začiatok (unix čas), 0 = nevypočítané
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: okno_do_ep              # okno FVE dnes — koniec (unix čas)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: slnecny_den_od_ep       # kedy začal slnečný deň (unix čas); platí, ak je v dnešnom okne
    type: uint32_t              # (restore: po reštarte ESP cez deň stykače hneď späť)
    restore_value: true
    initial_value: '0'
  - id: prebytok_od_ms          # od kedy trvá prebytok ≥ prah (pred slnečným dňom), 0 = netrvá
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: v_okne_g                # pre senzory: teraz je okno FVE
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: slnecny_den_g           # pre senzory: dnes je slnečný deň (a sme v okne)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: slnko_last_ms           # naposledy prebytok > 200 W ("svieti slnko", 10 min držanie)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: fan_afterrun_until_ms    # dobeh ventilátora po vypnutí dimmerov
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: cerpadlo_tuv_flow_until_ms  # EU-11-style beh čerpadla TUV po odbere (do kedy)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: cerpadlo_tuv_udrzba_active  # čerpadlo TUV — údržbový beh práve prebieha (hysteréza)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: bypass_tuv_change_ms      # čas poslednej zmeny bypass stykača TUV (debounce)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: bypass_podlaha_change_ms  # čas poslednej zmeny bypass stykača podlaha (debounce)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: bypass_tuv_fve            # FVE strana chce bypass TUV (nezávisle od Daikinu)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: bypass_tuv_armed          # dimmer už 1 cyklus (≥3s) na 100% pred ZOP — proti iskreniu
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: bypass_podlaha_armed
    type: bool
    restore_value: false
    initial_value: 'false'
  # --- Ostrá verzia 2026-11-15: Shelly + Solax cloud cez HA ------------------
  - id: shelly_seen_ms            # posledné Shelly čítanie, ktoré regulácia už spracovala
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: shelly_brzda_ep           # unix čas posledného brzdenia podľa Shelly (odber)
    type: int64_t
    restore_value: false
    initial_value: '0'
  - id: solax_epoch               # čas merania posledného údaja zo Solax cloudu (unix)
    type: int64_t
    restore_value: false
    initial_value: '0'
  - id: solax_pending_epoch       # nový údaj videný 1. cyklus (čaká na atribúty)
    type: int64_t
    restore_value: false
    initial_value: '0'
  - id: solax_seen_epoch          # posledný údaj, z ktorého sa už spravil krok
    type: int64_t
    restore_value: false
    initial_value: '0'
  - id: solax_vek_s               # vek údaja zo Solaxu (s), 99999 = žiadny
    type: float
    restore_value: false
    initial_value: '99999'
  - id: ciel_solax_W              # posledný cieľ výkonu špirál z kroku zo Solaxu
    type: float
    restore_value: false
    initial_value: '0'
  - id: p_odhad_tuv               # odhad výkonu do TUV zo špirály (FVE/manuál), W
    type: float
    restore_value: false
    initial_value: '0'
  - id: p_odhad_tuv_daikin        # odhad výkonu do TUV cez bypass na žiadosť Daikinu (K3M), W
    type: float
    restore_value: false
    initial_value: '0'
  - id: k3m_siet_Ws               # K3M zo siete — nazbieraná energia od posledného zverejnenia, W·s
    type: float
    restore_value: false
    initial_value: '0'
  - id: k3m_slnko_Ws              # K3M zo slnka (FVE) — nazbieraná energia od posledného zverejnenia, W·s
    type: float
    restore_value: false
    initial_value: '0'
  - id: p_odhad_pod               # odhad výkonu do podlahy, W
    type: float
    restore_value: false
    initial_value: '0'
  - id: fan_skrine_pct            # PWM ventilátora skrine (%)
    type: float
    restore_value: false
    initial_value: '0'
  - id: fan_tuv_teplo             # fan dosky TUV zapnutý kvôli teplote TRIAC-u (hysteréza)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fan_pod_teplo
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: triac_prehriaty_tuv       # TRIAC TUV ≥ 80 °C (do < 70 °C) → výkon 0
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: triac_prehriaty_pod
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fan_tuv_until_ms          # dobeh fanu na doske dimmera TUV
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: fan_pod_until_ms          # dobeh fanu na doske dimmera podlaha
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Počítadlá zopnutí stykačov (viď "POČÍTADLÁ ZOPNUTÍ" nižšie) — restore_value:
  # true zámerne (na rozdiel od ostatných globálov vyššie), sú to ŽIVOTNÉ súčty
  # (prežijú reštart/OTA), nie stav jedného regulačného cyklu.
  - id: cnt_stykac_tuv
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: cnt_bypass_tuv
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: cnt_stykac_podlaha
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: cnt_bypass_podlaha
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: cnt_stykac_obeh_tuv
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: cnt_stykac_obeh_podlaha
    type: uint32_t
    restore_value: true
    initial_value: '0'

# ============================================================================
# MERANIE PREBYTKU (ostrá verzia 2026-11-15)
# ============================================================================
# Kým nie je Solax dongl (rozhodnutie usera 2026-11-15):
#  - SHELLY 3EM (prípojka) priamo z ESP (čítanie 2 s, regulácia 5 s) = rýchla brzda/plyn:
#      odber zo siete > 200 W → uber, pretok do siete > 50 W → pridaj.
#  - SOLAX CLOUD cez HA (sensor.solax_cloud_realtime, ~raz za 4 min): výkon
#    batérie, SoC, sieť + čas merania (dataTime). Pri KAŽDOM NOVOM údaji jeden
#    krok regulácie podľa nabíjania batérie (podlaha → TUV/batéria ¾:¼).
#    Obmedzenie: kým batéria nie je na min SoC, menič pri mraku dorovná
#    špirály z batérie a Shelly ukazuje ~0 → zistí sa až pri ďalšom údaji
#    zo Solaxu (max ~5 min, odsúhlasené). Preto rezerva 300 W a krok max
#    +1000 W. Údaj starší ako 10 min → len Shelly.
#  - Bez Shelly (> 15 s) → výkon 0. Bez HA/Solaxu → núdzový režim len zo
#    Shelly (hreje len z viditeľného pretoku, drží ~300 W pretok).
# Regulácia počíta len z NOVÉHO merania (oprava 2026-11-15 — pri zamrznutom
# meraní by inak opakovane pripočítavala starú chybu).
# ----------------------------------------------------------------------------
http_request:
  # request BLOKUJE hlavnú slučku (ESPHome http_request je synchrónny) — pri čítaní
  # každé 2 s krátky timeout; Shelly bežne odpovie za desiatky ms
  timeout: 800ms

interval:
  # Časový limit manuálneho výkonu (každých 10 s). Po vypršaní → 0 = automatika,
  # záznam do text senzora (→ upozornenie v HA). Beží aj v testovacej verzii.
  - interval: 10s
    then:
      - lambda: |-
          const uint32_t lim_ms = (uint32_t) (id(manual_limit_h).state * 3600000.0f);
          auto skontroluj = [&](template_::TemplateNumber *num, uint32_t &od, const char *meno) {
            if (num->state <= 0.5f || od == 0) return;
            if (millis() - od < lim_ms) return;
            ESP_LOGW("manual", "%s: manuálny výkon %.0f %% vypršal po %.0f h -> automatika",
                     meno, num->state, id(manual_limit_h).state);
            od = 0;
            auto call = num->make_call();
            call.set_value(0);
            call.perform();
            char buf[64];
            auto t = id(esptime).now();
            if (t.is_valid())
              snprintf(buf, sizeof(buf), "%s %d.%d. %02d:%02d (po %.0f h)", meno, t.day_of_month,
                       t.month, t.hour, t.minute, id(manual_limit_h).state);
            else
              snprintf(buf, sizeof(buf), "%s (po %.0f h)", meno, id(manual_limit_h).state);
            id(manual_vyprsal_txt).publish_state(buf);
          };
          skontroluj(id(manual_tuv_pct), id(manual_tuv_od_ms), "TUV");
          skontroluj(id(manual_podlaha_pct), id(manual_pod_od_ms), "Podlaha");

  # --- SHELLY 3EM-63 Gen3 (${shelly_ip}, overené 2026-11-09) ------------------
  # Čítanie každé 2 s (2026-11-16, predtým 5 s; 1 s fungovalo, user zvolil 2 s pre
  # rezervu). Regulácia beží stále každých 5 s s posledným údajom (zisky ladené na 5 s);
  # 2 s využíva rozdelenie K3M sieť/slnko.
  # Shelly neodpovedá → skúšať len každých 5 s (request blokuje slučku do timeoutu).
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              static uint32_t posledny = 0;
              uint32_t n = millis();
              bool ok = id(shelly_last_ms) != 0 && n - id(shelly_last_ms) <= 5000;
              if (!ok && posledny != 0 && n - posledny < 5000) return false;
              posledny = n;
              return true;
          then:
            - http_request.get:
                url: "http://${shelly_ip}/rpc/EM.GetStatus?id=0"
                capture_response: true
                max_response_buffer_size: 2048
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                          // is<float>() — hodnota 0 W je platná, nie "chýba"
                          if (!root["total_act_power"].is<float>()) return false;
                          id(grid_power) = root["total_act_power"].as<float>();   // + odber, − pretok
                          return true;
                        });
                        if (ok) id(shelly_last_ms) = millis();   // LEN pri úspešnom parse
                on_error:
                  then:
                    - logger.log: "Shelly EM.GetStatus: request zlyhal"
      # K3M (bypass TUV na žiadosť Daikinu): rozdelenie výkonu na zo siete / zo slnka.
      # Zo siete = aktuálny odber zo siete, najviac výkon špirály (odber sa prednostne
      # pripíše špirále — opatrný odhad); bez čerstvého merania → celé zo siete.
      - lambda: |-
          static uint32_t pred = 0;
          uint32_t n = millis();
          float dt = pred != 0 ? (n - pred) / 1000.0f : 0.0f;
          pred = n;
          float p = id(p_odhad_tuv_daikin);
          if (p <= 0.0f || dt <= 0.0f || dt > 10.0f) return;
          bool cerstve = id(shelly_last_ms) != 0 && n - id(shelly_last_ms) <= 5000;
          float siet = cerstve ? clamp(id(grid_power), 0.0f, p) : p;
          id(k3m_siet_Ws) += siet * dt;
          id(k3m_slnko_Ws) += (p - siet) * dt;

  # OKNO FVE (2026-11-16): východ + X … západ − Y pre dnešný deň.
  # Samostatne (nie v lambde regulácie) — výpočet slnka potrebuje zásobník; v regulácii
  # ESP padalo (OTA rollback 2026-11-16).
  # Kontrola každých 10 s, výpočet hneď po synchronizácii času a potom raz za minútu
  # (prvý výpočet do 60 s po štarte → keby padol, OTA rollback ešte zaberie).
  - interval: 10s
    then:
      - lambda: |-
          if (!id(esptime).now().is_valid()) return;
          static uint32_t posl = 0;
          if (id(okno_od_ep) != 0 && millis() - posl < 60000) return;
          posl = millis();
          // dátum v UTC o 0:00 → východ/západ toho dňa (v SEČ/SELČ vždy po 0:00 UTC)
          ESPTime d = id(esptime).utcnow();
          d.hour = 0; d.minute = 0; d.second = 0;
          d.recalc_timestamp_utc();
          auto vy = id(slnko_poloha).sunrise(d, -0.833);
          auto za = id(slnko_poloha).sunset(d, -0.833);
          if (!vy.has_value() || !za.has_value()) return;
          id(okno_od_ep) = vy->timestamp + (int32_t) id(okno_po_vychode_min).state * 60;
          id(okno_do_ep) = za->timestamp - (int32_t) id(okno_pred_zapadom_min).state * 60;

  # ============================================================================
  # REGULÁCIA (každých 5 s) — rozdelenie prebytku, stykače, bypass, čerpadlá,
  # ventilátory. Celá logika je zhrnutá v ../README.sk.md
  # (sekcia „Ostrá verzia 2026-11-15“).
  # ============================================================================
  - interval: 5s
    then:
      - lambda: |-
          if (!${regulacia_aktivna}) return;     // testovacia verzia: regulácia vypnutá
          // Po štarte 15 s nič neprepínať (2026-11-15: pri OTA sa ESP 2× zresetovalo, keď
          // hneď po štarte naraz zoplo viac stykačov — prúdový náraz / rušenie).
          if (millis() < 15000) return;
          // Najviac JEDNO relé za cyklus (5 s) — stykače sa nezopínajú naraz.
          int zmeny_rele = 0;
          auto prepni = [&](switch_::Switch *sw, bool zap) -> bool {
            if (sw->state == zap) return true;
            if (zmeny_rele >= 1) return false;          // počká na ďalší cyklus
            zmeny_rele++;
            if (zap) sw->turn_on(); else sw->turn_off();
            return true;
          };
          // VÝKON → ÚROVEŇ DIMMERA. Krivka DimmerLinku LINEAR (úroveň = podiel polperiódy).
          // Prepočet podľa KALIBRÁCIE Shelly 2026-11-15 (batéria na min SoC, dom v kľude,
          // TUV 3003 W, podlaha 595 W pri 100 %; oba dimmery rovnako → priemer). Teória
          // fázového riadenia (L − sin 2πL / 2π) dávala v strede o 3–5 bodov menej.
          // Pod 20 % úrovne nemerané → body z teórie. RMS krivka nepoužiteľná (25 % → 0 W).
          // Regulácia počíta vo VÝKONE (duty = podiel výkonu) → tu inverzia tabuľky.
          auto set_dimmer = [](light::LightState *l, float vykon) {
            static const float LT[] = {0.00f, 0.10f, 0.15f, 0.20f, 0.26f, 0.30f, 0.34f, 0.37f, 0.40f,
                                       0.45f, 0.50f, 0.55f, 0.60f, 0.66f, 0.74f, 1.00f};
            static const float FT[] = {0.000f, 0.008f, 0.022f, 0.057f, 0.123f, 0.178f, 0.240f, 0.294f, 0.353f,
                                       0.446f, 0.545f, 0.641f, 0.722f, 0.814f, 0.907f, 1.000f};
            if (vykon <= 0.001f) {
              if (l->current_values.is_on()) l->turn_off().set_transition_length(0).perform();
            } else {
              float lv = 1.0f;
              for (int i = 1; i < 16; i++) {
                if (vykon <= FT[i]) {
                  lv = LT[i - 1] + (LT[i] - LT[i - 1]) * (vykon - FT[i - 1]) / (FT[i] - FT[i - 1]);
                  break;
                }
              }
              // +0,005: komponent úroveň orezáva (brightness × 100 → celé %), nie zaokrúhľuje
              float level = vykon >= 0.999f ? 1.0f : std::min(1.0f, lv + 0.005f);
              auto call = l->turn_on();
              call.set_brightness(level);
              call.set_transition_length(0);
              call.perform();
            }
          };
          uint32_t now = millis();
          auto t = id(esptime).now();
          char buf[160];
          std::string krok;                      // diagnostika: čo spravil tento cyklus
          //
          // --- MERANIE ------------------------------------------------------------
          bool shelly_ok = id(shelly_last_ms) != 0 && (now - id(shelly_last_ms) <= 15000);
          bool shelly_new = shelly_ok && id(shelly_last_ms) != id(shelly_seen_ms);
          if (shelly_new) id(shelly_seen_ms) = id(shelly_last_ms);
          int64_t ep_now = t.is_valid() ? (int64_t) t.timestamp : 0;
          int64_t vek = (ep_now > 0 && id(solax_epoch) > 0) ? ep_now - id(solax_epoch) : 99999;
          id(solax_vek_s) = (float) vek;
          bool solax_ok = shelly_ok && vek >= -120 && vek <= 600
                          && !std::isnan(id(solax_bat_ha).state) && !std::isnan(id(solax_soc_ha).state)
                          && !std::isnan(id(solax_grid_ha).state);
          // Nový údaj = zmenil sa čas merania A v ďalšom cykle je stále ten istý
          // (state a atribúty prichádzajú z HA zvlášť — počkám 1 cyklus, kým dorazia všetky).
          bool solax_new = false;
          if (solax_ok && id(solax_epoch) != id(solax_seen_epoch)) {
            if (id(solax_epoch) == id(solax_pending_epoch)) {
              solax_new = true;
              id(solax_seen_epoch) = id(solax_epoch);
            } else {
              id(solax_pending_epoch) = id(solax_epoch);
            }
          }
          id(zdroj_merania) = !shelly_ok ? 0 : (solax_ok ? 3 : 2);
          //
          // --- OKNO FVE + SLNEČNÝ DEŇ (2026-11-16) — izolačné stykače + kedy sa smie
          // hriať z FVE. Okno = východ + X … západ − Y (interval OKNO FVE nižšie, raz za minútu).
          // V okne čakám na prebytok ≥ prah trvajúci N min → slnečný deň do konca okna.
          // Čas nesynchronizovaný (NTP) → mimo okna, bezpečný default.
          // Okno počíta interval „OKNO FVE“ (raz za minútu, mimo tejto lambdy — zásobník).
          uint32_t ep = t.is_valid() ? (uint32_t) t.timestamp : 0;
          bool okno_fve = ep != 0 && id(okno_od_ep) != 0 && ep >= id(okno_od_ep) && ep < id(okno_do_ep);
          auto slnecny = [&]() -> bool {
            return okno_fve && id(slnecny_den_od_ep) >= id(okno_od_ep) && id(slnecny_den_od_ep) < id(okno_do_ep);
          };
          if (okno_fve && !slnecny() && id(prebytok_W) >= id(slnecny_den_prah_w).state) {
            if (id(prebytok_od_ms) == 0) id(prebytok_od_ms) = now;
            if (now - id(prebytok_od_ms) >= (uint32_t) (id(slnecny_den_trvanie_min).state * 60000.0f)) {
              id(slnecny_den_od_ep) = ep;
              ESP_LOGI("fve", "Slnečný deň: prebytok %.0f W ≥ %.0f W počas %.0f min → stykače ZAP do konca okna",
                       id(prebytok_W), id(slnecny_den_prah_w).state, id(slnecny_den_trvanie_min).state);
            }
          } else {
            id(prebytok_od_ms) = 0;
          }
          bool slnecny_den = slnecny();
          id(v_okne_g) = okno_fve;
          id(slnecny_den_g) = slnecny_den;
          // Ďalej v kóde: hrieť z FVE a držať izolačné stykače len v slnečný deň.
          bool is_day = slnecny_den;
          //
          // --- DAIKIN BACKUP OHREV TUV (K3M): LEN bypass TUV priamo, bez ohľadu na
          // FVE/meranie/čas. Limit max_t_tuv; výpadok DS18B20 TUV (NaN) → ide aj tak
          // (stráži Daikin, rozhodnutie 2026-11-11).
          bool daikin_override_tuv = id(daikin_ziada_ohrev_tuv).state
                                      && (std::isnan(id(t_tuv).state)
                                          || id(t_tuv).state < id(max_t_tuv).state);
          //
          // --- POVOLENIA (hysteréza 2 °C; NaN → porovnania false → nehreje z FVE)
          if (id(t_tuv).state >= id(max_t_tuv).state) id(tuv_full) = true;
          else if (id(t_tuv).state < id(max_t_tuv).state - 2.0f) id(tuv_full) = false;
          bool tuv_en = is_day && !id(tuv_full) && (id(t_tuv).state < id(max_t_tuv).state);
          //
          int rezim = (int) id(rezim_kurenia).active_index().value_or(0);  // 0 leto, 1 len prebytky, 2 kúrenie
          // Čerpadlo podlahy ručne VYP → podlaha sa nehreje vôbec (voda by nebežala).
          bool cerpadlo_pod_vyp = (int) id(rezim_cerpadla_podlaha).active_index().value_or(0) == 2;
          if (id(t_podlaha).state >= id(max_t_podlaha).state) id(pod_full) = true;
          else if (id(t_podlaha).state < id(max_t_podlaha).state - 2.0f) id(pod_full) = false;
          bool pod_en = is_day && rezim != 0 && !cerpadlo_pod_vyp && !id(pod_full)
                        && (id(t_podlaha).state < id(max_t_podlaha).state);
          //
          const float CAP_POD = id(p_spirala_pod).state, CAP_TUV = id(p_spirala_tuv).state;   // ladenie z HA
          float cap_pod = pod_en ? CAP_POD : 0.0f;
          float cap_tuv = tuv_en ? CAP_TUV : 0.0f;
          //
          // --- HISTÓRIA výkonu špirál (D) — údaj zo Solaxu je starý 1–5 min, treba
          // vedieť, aký výkon špirál bol V ČASE MERANIA (128 × 5 s ≈ 10 min).
          static float hist_d[128];
          static int64_t hist_ep[128];
          static int hist_i = 0, hist_n = 0;
          auto d_v_case = [&](int64_t ep) -> float {
            float best = id(total_duty_W);
            int64_t best_ep = -1;
            for (int k = 0; k < hist_n; k++) {
              if (hist_ep[k] <= ep && hist_ep[k] > best_ep) { best_ep = hist_ep[k]; best = hist_d[k]; }
            }
            if (best_ep < 0 && hist_n > 0) {            // starší než história → najstarší záznam
              int64_t o = INT64_MAX;
              for (int k = 0; k < hist_n; k++) if (hist_ep[k] < o) { o = hist_ep[k]; best = hist_d[k]; }
            }
            return best;
          };
          //
          // --- REGULÁCIA: D = cieľový výkon špirál spolu (W) -----------------------
          // Ladenie z HA (2026-11-15) — sekcia "LADENIE REGULÁCIE" v number:
          const float KI = id(lad_zisk_shelly).state;              // zisk pre Shelly kroky
          const float K_SOLAX = id(lad_krok_solax).state / 100.0f; // časť rozdielu pri kroku zo Solaxu (len pridávanie)
          const float KROK_MAX = id(lad_krok_solax_max).state;     // max pridanie jedným krokom zo Solaxu
          const float REZERVA_BAT = id(lad_rezerva_bat).state;     // batéria si nechá aspoň toľko (cloud mešká)
          const float PRAH_ODBER = id(lad_prah_odber).state;       // odber zo siete → brzda
          const float PRAH_PRETOK = id(lad_prah_pretok).state;     // pretok do siete → plyn
          const float NUDZA_PRETOK = id(lad_nudza_pretok).state;   // len Shelly: držaný pretok
          float D = id(total_duty_W);
          if (!shelly_ok) {
            // WATCHDOG: bez Shelly nemám brzdu → nehrejem z prebytku. Bypass
            // rozopne bežná ROZ sekvencia nižšie (TRIAC prevezme prúd).
            if (D > 0.0f) krok = "bez Shelly → 0 W";
            D = 0.0f;
            id(prebytok_W) = 0.0f;
            id(bypass_tuv_armed) = false;
            id(bypass_podlaha_armed) = false;
          } else {
            float g = id(grid_power);                    // + odber, − pretok
            float p_imp = std::max(0.0f, g), p_exp = std::max(0.0f, -g);
            if (shelly_new) {
              if (p_imp > PRAH_ODBER) {
                float dD = -2.0f * KI * p_imp;           // ťahám zo siete → rýchlo uber
                if (ep_now > 0) id(shelly_brzda_ep) = ep_now;
                id(prebytok_W) = 0.0f;
                if (D > 0.0f) {
                  snprintf(buf, sizeof(buf), "Shelly odber %.0f W → %.0f W", p_imp, std::max(dD, -D));
                  krok = buf;
                }
                D += dD;
              } else if (solax_ok) {
                if (p_exp > PRAH_PRETOK && cap_pod + cap_tuv > D + 1.0f) {
                  float dD = KI * p_exp;                 // batéria už neberie → do špirál
                  snprintf(buf, sizeof(buf), "Shelly pretok %.0f W → +%.0f W", p_exp, dD);
                  krok = buf;
                  D += dD;
                  id(prebytok_W) = std::max(id(prebytok_W), p_exp + D);
                }
              } else {
                // NÚDZOVÝ REŽIM len zo Shelly: batériu nevidím → len z pretoku,
                // držím ~300 W pretok. Pretok zmizol → špirály možno ťahajú
                // z batérie → D na polovicu.
                id(prebytok_W) = p_exp + D;
                if (g > -100.0f) {
                  if (D > 1.0f) { krok = "len Shelly: pretok zmizol → výkon / 2"; }
                  D *= 0.5f;
                } else if (cap_pod + cap_tuv > D + 1.0f || p_exp < NUDZA_PRETOK) {
                  float dD = KI * (p_exp - NUDZA_PRETOK);
                  snprintf(buf, sizeof(buf), "len Shelly: pretok %.0f W → %+.0f W", p_exp, dD);
                  krok = buf;
                  D += dD;
                }
              }
            }
            if (solax_new && p_imp <= PRAH_ODBER) {
              // KROK ZO SOLAXU: S = prebytok v čase merania (batéria + sieť + špirály).
              float b = clamp(id(podiel_baterie_pct).state / 100.0f, 0.0f, 0.9f);
              if (id(solax_soc_ha).state >= id(soc_bateria_plna).state) b = 0.0f;   // plná → podiel do TUV
              float d_s = d_v_case(id(solax_epoch));
              float S = id(solax_bat_ha).state + id(solax_grid_ha).state + d_s;
              float avail = S - REZERVA_BAT;
              float Dt = (avail <= cap_pod) ? avail : cap_pod + (avail - cap_pod) * (1.0f - b);
              Dt = clamp(Dt, 0.0f, cap_pod + cap_tuv);
              float dD = Dt - d_s;
              if (dD > 0.0f) dD = std::min(K_SOLAX * dD, KROK_MAX);  // pridávam opatrne, uberám hneď
              id(ciel_solax_W) = Dt;
              id(prebytok_W) = std::max(0.0f, S);
              snprintf(buf, sizeof(buf), "Solax: bat %+.0f W, sieť %+.0f W, SoC %.0f %%, špirály %.0f W → cieľ %.0f W (%+.0f W)",
                       id(solax_bat_ha).state, id(solax_grid_ha).state, id(solax_soc_ha).state, d_s, Dt, dD);
              krok = buf;
              if (dD <= 0.0f) {
                D = std::min(D, Dt);                     // uber (nikdy nad cieľ)
              } else if (id(shelly_brzda_ep) >= id(solax_epoch)) {
                krok += " — Shelly medzitým brzdil, nepridávam";
              } else {
                D = std::max(D, d_s + dD);               // pridaj (pretok zo Shelly ponechaj)
              }
            }
          }
          D = clamp(D, 0.0f, cap_pod + cap_tuv);
          id(total_duty_W) = D;
          if (ep_now > 0) {                              // história pre kroky zo Solaxu
            hist_d[hist_i] = D;
            hist_ep[hist_i] = ep_now;
            hist_i = (hist_i + 1) % 128;
            if (hist_n < 128) hist_n++;
          }
          float duty_pod = cap_pod > 0.0f ? clamp(D / CAP_POD, 0.0f, 1.0f) : 0.0f;
          float duty_tuv = cap_tuv > 0.0f ? clamp((D - cap_pod) / CAP_TUV, 0.0f, 1.0f) : 0.0f;
          //
          // --- MANUÁLNE VYNÚTENIE (0 = vypnuté) — prebíja reguláciu aj watchdog.
          // Tepelný strop platí. Podlaha nie pri čerpadle ručne VYP.
          bool manual_tuv_active = id(manual_tuv_pct).state > 0.5f;
          if (manual_tuv_active) {
            duty_tuv = (id(t_tuv).state < id(max_t_tuv).state)
                       ? clamp(id(manual_tuv_pct).state / 100.0f, 0.0f, 1.0f) : 0.0f;
          }
          bool manual_podlaha_active = id(manual_podlaha_pct).state > 0.5f && !cerpadlo_pod_vyp;
          if (manual_podlaha_active) {
            duty_pod = (id(t_podlaha).state < id(max_t_podlaha).state)
                       ? clamp(id(manual_podlaha_pct).state / 100.0f, 0.0f, 1.0f) : 0.0f;
          }
          // --- TEPLOTA TRIAC-U (2026-11-15) — len pri „Teplota TRIAC — zapojená“ a
          // rozumnej hodnote (−20…150 °C). ≥ 80 °C → výkon dimmera 0, späť pod 70 °C.
          // Daikin bypass (K3M) to neovplyvní — TRIAC vtedy nevedie.
          bool tt_ok = id(teplota_triac_zapojena).state;
          auto platna = [](float x) { return !std::isnan(x) && x > -20.0f && x < 150.0f; };
          float t_tr_tuv = id(t_dimmer_tuv).state, t_tr_pod = id(t_dimmer_podlaha).state;
          if (tt_ok && platna(t_tr_tuv)) {
            if (t_tr_tuv >= 80.0f) id(triac_prehriaty_tuv) = true;
            else if (t_tr_tuv < 70.0f) id(triac_prehriaty_tuv) = false;
            if (t_tr_tuv >= 50.0f) id(fan_tuv_teplo) = true;
            else if (t_tr_tuv < 45.0f) id(fan_tuv_teplo) = false;
          } else {
            id(triac_prehriaty_tuv) = false;
            id(fan_tuv_teplo) = false;
          }
          if (tt_ok && platna(t_tr_pod)) {
            if (t_tr_pod >= 80.0f) id(triac_prehriaty_pod) = true;
            else if (t_tr_pod < 70.0f) id(triac_prehriaty_pod) = false;
            if (t_tr_pod >= 50.0f) id(fan_pod_teplo) = true;
            else if (t_tr_pod < 45.0f) id(fan_pod_teplo) = false;
          } else {
            id(triac_prehriaty_pod) = false;
            id(fan_pod_teplo) = false;
          }
          if (id(triac_prehriaty_tuv) && duty_tuv > 0.0f) {
            snprintf(buf, sizeof(buf), "TRIAC TUV prehriaty %.0f °C → výkon TUV 0", t_tr_tuv);
            krok = buf;
            duty_tuv = 0.0f;
          }
          if (id(triac_prehriaty_pod) && duty_pod > 0.0f) {
            snprintf(buf, sizeof(buf), "TRIAC podlaha prehriaty %.0f °C → výkon podlahy 0", t_tr_pod);
            krok = buf;
            duty_pod = 0.0f;
          }
          id(duty_tuv_pub) = duty_tuv;
          id(duty_pod_pub) = duty_pod;
          if (!krok.empty()) {
            ESP_LOGI("regulacia", "%s", krok.c_str());
            id(regulacia_krok_txt).publish_state(krok);
          }
          //
          // --- RELÁCIA OHREVU PODLAHY — čerpadlo beží nepretržite od prvého prebytku
          // do podlahy, kým voda nedosiahne max / neskončí deň / nezmení sa režim.
          bool rel_pred = id(pod_relacia);
          if (!pod_en && !manual_podlaha_active) id(pod_relacia) = false;
          else if (duty_pod > 0.05f) id(pod_relacia) = true;
          if (rel_pred != id(pod_relacia)) id(cerpadlo_podlaha_aplikuj).execute();
          //
          // --- BYPASS STYKAČ TUV: ZOP pri ≥ 97 % (dimmer najprv 1 cyklus na 100 %),
          // ROZ pri ≤ 95 %, min. 15 s medzi zmenami. Daikin override priamo.
          const uint32_t BYPASS_MIN_DWELL_MS = 15000;
          // OPRAVA 2026-11-15: FVE strana má VLASTNÝ stav (bypass_tuv_fve), nie fyzický
          // stav stykača — keď bypass drží Daikin (K3M), FVE ho nesmie brať ako „svoj“
          // (predtým každých 5 s prepínala dimmer na 100 % a späť a energiu z Daikinu
          // počítala ako FVE).
          bool want_bypass_tuv = id(bypass_tuv_fve);
          if (id(bypass_tuv_fve)) {
            if (duty_tuv <= 0.95f && (now - id(bypass_tuv_change_ms) > BYPASS_MIN_DWELL_MS)) {
              want_bypass_tuv = false;
              id(bypass_tuv_change_ms) = now;
              set_dimmer(id(dimmer_tuv), duty_tuv);
            } else {
              set_dimmer(id(dimmer_tuv), 1.0f);
            }
          } else if (duty_tuv >= 0.97f) {
            set_dimmer(id(dimmer_tuv), 1.0f);
            if (id(bypass_tuv_armed) && (now - id(bypass_tuv_change_ms) > BYPASS_MIN_DWELL_MS)) {
              want_bypass_tuv = true;
              id(bypass_tuv_change_ms) = now;
              id(bypass_tuv_armed) = false;
            } else {
              id(bypass_tuv_armed) = true;
            }
          } else {
            id(bypass_tuv_armed) = false;
            set_dimmer(id(dimmer_tuv), duty_tuv);
          }
          id(bypass_tuv_fve) = want_bypass_tuv;
          bool bypass_tuv_ciel = want_bypass_tuv || daikin_override_tuv;
          prepni(id(bypass_tuv), bypass_tuv_ciel);
          // ODHAD VÝKONU do špirál (pre počítadlá energie) — nemeriame prúd (CUR-S
          // nezmeraný), preto: menovitý výkon × požadovaný podiel výkonu (prepočet na
          // úroveň LINEAR krivky v set_dimmer, overené meraním),
          // bypass zopnutý = menovitý výkon. Bypass TUV len kvôli Daikinu (K3M) sa
          // počíta zvlášť — to je ohrev zo siete na žiadosť Daikinu, nie z FVE.
          if (id(bypass_tuv).state) {
            bool fve = id(bypass_tuv_fve);
            id(p_odhad_tuv) = fve ? CAP_TUV : 0.0f;
            id(p_odhad_tuv_daikin) = fve ? 0.0f : CAP_TUV;
          } else {
            id(p_odhad_tuv) = duty_tuv * CAP_TUV;
            id(p_odhad_tuv_daikin) = 0.0f;
          }
          // --- BYPASS STYKAČ PODLAHA — rovnaká logika, bez Daikina
          if (id(bypass_podlaha).state) {
            if (duty_pod <= 0.95f && (now - id(bypass_podlaha_change_ms) > BYPASS_MIN_DWELL_MS)
                && prepni(id(bypass_podlaha), false)) {
              id(bypass_podlaha_change_ms) = now;
              set_dimmer(id(dimmer_podlaha), duty_pod);
            } else {
              set_dimmer(id(dimmer_podlaha), 1.0f);
            }
          } else if (duty_pod >= 0.97f) {
            set_dimmer(id(dimmer_podlaha), 1.0f);
            if (id(bypass_podlaha_armed) && (now - id(bypass_podlaha_change_ms) > BYPASS_MIN_DWELL_MS)
                && prepni(id(bypass_podlaha), true)) {
              id(bypass_podlaha_change_ms) = now;
              id(bypass_podlaha_armed) = false;
            } else {
              id(bypass_podlaha_armed) = true;
            }
          } else {
            id(bypass_podlaha_armed) = false;
            set_dimmer(id(dimmer_podlaha), duty_pod);
          }
          id(p_odhad_pod) = id(bypass_podlaha).state ? CAP_POD : duty_pod * CAP_POD;
          // --- IZOLAČNÉ STYKAČE: slnečný deň v okne FVE (is_day, viď vyššie). Podlaha len
          // v režime ≠ Vypnuté a pri čerpadle ≠ VYP. Manuálny výkon prebíja okno.
          bool st_tuv = is_day || manual_tuv_active;
          bool st_pod = (is_day && rezim != 0 && !cerpadlo_pod_vyp) || manual_podlaha_active;
          prepni(id(stykac_tuv), st_tuv);
          prepni(id(stykac_podlaha), st_pod);
          //
          // --- ČERPADLO TUV (náhrada TechController ECO) ---------------------------
          bool je_vikend = (t.day_of_week == 1 || t.day_of_week == 7);   // 1 = nedeľa, 7 = sobota
          int min_teraz = t.hour * 60 + t.minute;
          int okno_od = je_vikend ? (int) id(cerpadlo_tuv_okno_vikend_od).state
                                   : (int) id(cerpadlo_tuv_okno_pracovny_od).state;
          int okno_do = je_vikend ? (int) id(cerpadlo_tuv_okno_vikend_do).state
                                   : (int) id(cerpadlo_tuv_okno_pracovny_do).state;
          bool v_okne = t.is_valid() && min_teraz >= okno_od && min_teraz <= okno_do;
          float rozdiel_tuv = id(t_tuv).state - id(t_tuv_vratna).state;
          // (1) ODBER: prietokomer "ide" + (bojler − vratná) > prah → beh na pevný čas
          if (v_okne && id(odber_tuv).state && rozdiel_tuv > id(delta_tuv_cerpadlo).state) {
            id(cerpadlo_tuv_flow_until_ms) = now
                + (uint32_t)(id(cerpadlo_tuv_operation_min).state * 60000.0f);
          }
          bool c_odber = (int32_t)(id(cerpadlo_tuv_flow_until_ms) - now) > 0;
          // (2) ÚDRŽBA: (bojler − vratná) > prah → beží, kým rozdiel neklesne o 1 °C pod prah
          if (id(cerpadlo_tuv_udrzba_active)) {
            if (!v_okne || !(rozdiel_tuv > id(delta_tuv_udrzba).state - 1.0f))
              id(cerpadlo_tuv_udrzba_active) = false;
          } else if (v_okne && rozdiel_tuv > id(delta_tuv_udrzba).state) {
            id(cerpadlo_tuv_udrzba_active) = true;
          }
          // (3) POČAS OHREVU (switch, default VYP) — špirála alebo Daikin bypass, dobeh 5 min
          if (id(cerpadlo_tuv_pri_ohreve).state && (duty_tuv > 0.01f || daikin_override_tuv)) {
            id(cerpadlo_tuv_ohrev_until_ms) = now + 5UL * 60000UL;
          }
          bool c_ohrev = (int32_t)(id(cerpadlo_tuv_ohrev_until_ms) - now) > 0;
          // (4) HORÚCA TUV + SLNKO: bojler ≥ prah, kým svieti slnko (prebytok > 200 W
          // niekedy za posledných 10 min), hysteréza 2 °C
          if (id(prebytok_W) > 200.0f) id(slnko_last_ms) = now;
          bool slnko = is_day && id(slnko_last_ms) != 0 && (now - id(slnko_last_ms) < 600000);
          if (id(cerpadlo_tuv_horuca_active)) {
            if (!slnko || !(id(t_tuv).state >= id(cerpadlo_tuv_horuca_t).state - 2.0f))
              id(cerpadlo_tuv_horuca_active) = false;
          } else if (slnko && id(t_tuv).state >= id(cerpadlo_tuv_horuca_t).state) {
            id(cerpadlo_tuv_horuca_active) = true;
          }
          bool c_tuv = c_ohrev || id(cerpadlo_tuv_horuca_active) || c_odber
                       || id(cerpadlo_tuv_udrzba_active) || manual_tuv_active;
          // TVRDÝ REŽIM (2026-11-16, servis): VYP = nikdy, Trvalo ZAP = vždy — bez ohľadu
          // na čokoľvek (aj manuál). Vypnutie hneď (nečaká na limit 1 relé/cyklus).
          int m_tuv = (int) id(rezim_cerpadla_tuv).active_index().value_or(2);
          if (m_tuv == 2) {
            if (id(cerpadlo_tuv).state) id(cerpadlo_tuv).turn_off();
          } else {
            prepni(id(cerpadlo_tuv), m_tuv == 1 || c_tuv);
          }
          std::string dovod;
          if (m_tuv == 2) dovod = "VYP (servis)";
          else if (m_tuv == 1) dovod = "trvalo ZAP";
          auto pridaj = [&](bool b, const char *s) { if (b) { if (!dovod.empty()) dovod += ", "; dovod += s; } };
          if (m_tuv == 0) {
            pridaj(c_odber, "odber");
            pridaj(id(cerpadlo_tuv_udrzba_active), "údržba");
            pridaj(c_ohrev, "ohrev");
            pridaj(id(cerpadlo_tuv_horuca_active), "horúca TUV");
            pridaj(manual_tuv_active, "manuál");
          }
          if (dovod.empty()) dovod = "—";
          if (id(cerpadlo_tuv_dovod_txt).state != dovod) id(cerpadlo_tuv_dovod_txt).publish_state(dovod);
          //
          // --- VENTILÁTOR SKRINE: podľa výkonu TRIAC-ov (min 35 %, dobeh 60 s).
          // Daikin bypass TRIAC nezaťažuje → nechladí sa.
          float fan_duty = std::max(duty_tuv, duty_pod);
          float fan_level = 0.0f;
          if (fan_duty > 0.02f) {
            id(fan_afterrun_until_ms) = now + 60000;
            fan_level = 0.35f + fan_duty * 0.65f;
          } else if ((int32_t)(id(fan_afterrun_until_ms) - now) > 0) {
            fan_level = 0.35f;
          }
          id(fan_pwm).set_level(fan_level);
          id(fan_skrine_pct) = fan_level * 100.0f;
          // --- FANY NA DOSKÁCH DIMMEROV: ZAP, keď dimmer beží (dobeh 60 s) ALEBO
          // TRIAC ≥ 50 °C (do < 45 °C) — teplota len pri „Teplota TRIAC — zapojená“.
          if (duty_tuv > 0.01f) id(fan_tuv_until_ms) = now + 60000;
          if (duty_pod > 0.01f) id(fan_pod_until_ms) = now + 60000;
          bool f_tuv = (int32_t)(id(fan_tuv_until_ms) - now) > 0 || id(fan_tuv_teplo);
          bool f_pod = (int32_t)(id(fan_pod_until_ms) - now) > 0 || id(fan_pod_teplo);
          if (f_tuv != id(fan_dimmer_tuv).state) { if (f_tuv) id(fan_dimmer_tuv).turn_on(); else id(fan_dimmer_tuv).turn_off(); }
          if (f_pod != id(fan_dimmer_podlaha).state) { if (f_pod) id(fan_dimmer_podlaha).turn_on(); else id(fan_dimmer_podlaha).turn_off(); }

# ============================================================================
# SOLAX CLOUD z HA (2026-11-15) — sensor.solax_cloud_realtime: stav = čas
# merania (dataTime, ISO), atribúty battery_power (+ nabíja), battery_soc,
# grid_power (+ pretok, − odber). Všetko z JEDNÉHO čítania cloudu.
# ============================================================================
# (sensor/text_sensor sú v sekciách vyššie — viď "SOLAX CLOUD" tam)

# ============================================================================
# PRE SOLAX DONGL (neskôr, ~2026-11-20) — lokálne API každé 3 s namiesto cloudu.
# Pôvodný návrh z 2026-11-09 (indexy registrov sú PREDPOKLAD — overiť proti
# appke). Po príchode donglu: naplniť solax_bat_ha/solax_grid_ha/solax_soc_ha
# ekvivalenty z donglu a krok zo Solaxu robiť pri každom čítaní (K_SOLAX 0,3,
# rezerva 50 W) — zvyšok regulácie ostáva.
# ----------------------------------------------------------------------------
#   - interval: 3s
#     then:
#       - http_request.post:
#           url: !secret solax_url
#           request_headers:
#             Content-Type: application/x-www-form-urlencoded
#           body: !secret solax_post_body
#           capture_response: true
#           max_response_buffer_size: 4096
#           on_response:
#             then:
#               - lambda: |-
#                   if (response->status_code != 200) return;
#                   bool ok = json::parse_json(body, [](JsonObject root) -> bool {
#                     JsonArray d = root["Data"];
#                     if (d.isNull() || d.size() < 104) return false;
#                     int16_t bat = (int16_t) (uint16_t) d[41].as<uint32_t>();          // W, + nabíja
#                     int32_t feed = (int32_t) ((d[35].as<uint32_t>() << 16)
#                                               | (d[34].as<uint32_t>() & 0xFFFF));     // W, + pretok
#                     float soc = d[103].as<float>();                                    // %
#                     if (soc < 0.0f || soc > 100.0f) return false;
#                     id(bat_power_W) = bat;
#                     id(grid_export_W) = feed;
#                     id(bat_soc) = soc;
