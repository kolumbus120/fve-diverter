<text x="60" y="3484" font-size="29" text-anchor="start" fill="#212121" font-weight="bold">Rezistory R1, R7, R8 daj do skrine pri ESP</text>
<text x="60" y="3528" font-size="29" text-anchor="start" fill="#212121">(medzi svorku DATA a 3,3 V), nie k snímaču.</text>
<text x="60" y="3572" font-size="29" text-anchor="start" fill="#212121" font-weight="bold">GND a 3,3 V môžu mať snímače spoločné,</text>
<text x="60" y="3616" font-size="29" text-anchor="start" fill="#212121">DATA musí ísť každý na svoj pin.</text>
<text x="60" y="3660" font-size="29" text-anchor="start" fill="#212121" font-weight="bold">Kontrola: v HA tlačidlo „Test — hľadať DS18B20“</text>
<text x="60" y="3704" font-size="29" text-anchor="start" fill="#212121">→ ukáže adresy na G21 / G5 / G13.</text>
